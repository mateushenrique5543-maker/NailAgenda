<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a67a45">
<title>Jozyhely Rodrigues — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f0e9;--bg-2:#efe5da;--surface:#fffdfa;--surface-2:#fbf6ef;--ink:#231a14;--ink-2:#3d2f26;--text:#3a2c23;--muted:#8d7d6f;--muted-2:#a89a8c;--gold:#c39a6a;--gold-deep:#a67a45;--gold-dark:#7a5630;--gold-light:#e6d4ba;--gold-glow:rgba(196,154,106,.22);--border:#ece1d4;--border-strong:#e0d0bd;--green:#4f8a5c;--green-bg:#e3f0e5;--red:#c15b5b;--red-bg:#fae0e0;--shadow-xs:0 1px 2px rgba(60,40,25,.05);--shadow-sm:0 1px 2px rgba(60,40,25,.04),0 4px 12px rgba(60,40,25,.05);--shadow-md:0 4px 12px rgba(60,40,25,.06),0 12px 28px rgba(60,40,25,.06);--shadow-lg:0 12px 32px rgba(60,40,25,.10),0 30px 60px rgba(60,40,25,.07);--radius-sm:12px;--radius:16px;--radius-md:20px;--radius-lg:26px;--radius-pill:999px;--ease:cubic-bezier(.22,.7,.25,1);--font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--font-serif:"Playfair Display",Georgia,serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:var(--font-sans);color:var(--text);background:radial-gradient(1200px 600px at 12% -10%,rgba(196,154,106,.18),transparent 55%),radial-gradient(900px 500px at 100% 0%,rgba(214,180,142,.16),transparent 50%),#d9cab8;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#fff}
.ico{display:inline-grid;place-items:center;flex-shrink:0;line-height:0;color:currentColor}
.ico svg{width:100%;height:100%;display:block}
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(60,40,25,.04)}
.screen{display:none;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:screenIn .32s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-serif);color:var(--ink);font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.12}
h2{font-size:21px;line-height:1.2}
h3{font-size:16px}
.eyebrow{display:block;color:var(--gold-deep);font-size:9.5px;letter-spacing:2.4px;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.content{padding:10px 18px 34px}
.top-header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 20px 14px;background:linear-gradient(180deg,rgba(255,253,250,.98),rgba(246,240,233,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:relative;z-index:5}
.header-left{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-size:18px;font-weight:600;box-shadow:0 6px 14px rgba(120,80,40,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.header-title strong{display:block;font-size:15px;letter-spacing:-.2px;color:var(--ink)}
.header-title span{display:block;color:var(--muted);font-size:9.5px;margin-top:3px;letter-spacing:.3px}
.header-action{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--gold-deep);display:grid;place-items:center;box-shadow:var(--shadow-xs);transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease)}
.header-action:active{transform:scale(.92)}
.header-action .ico{color:var(--gold-deep)}
.page-header{height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 14px;margin:0 -18px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(255,253,250,.96),rgba(246,240,233,.6));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:6}
.page-header>a{color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.page-header h2{text-align:center;font-size:18px;letter-spacing:-.2px;font-weight:600}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.section-title h2{font-size:20px}
.section-title a{color:var(--gold-deep);font-size:10.5px;font-weight:600;letter-spacing:.2px}
.btn{width:100%;min-height:50px;border:0;border-radius:var(--radius);background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 1px 2px rgba(0,0,0,.15),0 10px 24px rgba(30,20,12,.18);transition:transform .25s var(--ease),box-shadow .25s var(--ease);display:grid;place-items:center;padding:0 20px}
.btn:active{transform:translateY(0) scale(.985)}
.btn.outline{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.danger{background:linear-gradient(180deg,#d06a6a,#b85050)}
.btn.small{width:auto;padding:0 14px;min-height:34px;font-size:9.5px;border-radius:10px;box-shadow:none;letter-spacing:.4px;text-transform:none}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(700px 500px at 85% 5%,rgba(196,154,106,.35),transparent 55%),radial-gradient(600px 400px at 10% 100%,rgba(196,154,106,.22),transparent 55%),linear-gradient(165deg,#2e221a 0%,#1a120c 60%,#0f0a07 100%);color:#fff;position:relative;overflow:hidden}
.login-screen::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;opacity:.5;pointer-events:none}
.login-box{width:100%;text-align:center;position:relative;z-index:1}
.brand-symbol{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 60%),linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;font-family:var(--font-serif);font-size:38px;font-weight:600;box-shadow:0 20px 45px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.brand-name{font-family:var(--font-serif);font-size:29px;color:#f0dcc0;letter-spacing:-.5px;font-weight:600}
.brand-subtitle{font-size:8.5px;letter-spacing:4.5px;color:#c5b0a0;margin-top:7px;text-transform:uppercase;font-weight:600}
.login-photo{height:150px;margin:26px 0;border-radius:24px;background:linear-gradient(180deg,rgba(30,20,14,.1),rgba(30,20,14,.5)),url('assets/nail-nude.png') center/cover;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.login-box .btn{background:linear-gradient(180deg,#f5e3c8,#d8b78e);color:#231a14;box-shadow:0 10px 26px rgba(0,0,0,.28);margin-bottom:10px}
.login-box .btn.outline{background:transparent;color:#f0dcc0;border:1px solid rgba(240,220,192,.35);box-shadow:none}
.welcome-text{color:#a8988a;font-size:10px;margin-top:18px;letter-spacing:.3px}
.demo-entry{margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1)}
.demo-entry small{display:block;font-size:8.5px;letter-spacing:2.4px;color:#a8988a;font-weight:600;margin-bottom:12px}
.demo-btn{background:rgba(255,255,255,.06) !important;color:#e6d4ba !important;border:1px solid rgba(230,212,186,.2) !important;box-shadow:none !important;font-size:10.5px !important;min-height:44px !important}
.welcome{margin-top:18px;padding:0 2px}
.welcome h1{font-size:30px;line-height:1.12;letter-spacing:-.02em}
.welcome p{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.quick-card{min-height:94px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow-xs)}
.quick-card .ico{color:var(--gold-deep);margin-bottom:9px}
.quick-card strong{font-size:9.5px;font-weight:600;letter-spacing:.2px;color:var(--ink)}
.promo{min-height:160px;padding:24px;border-radius:var(--radius-lg);position:relative;overflow:hidden;color:#fff;background:linear-gradient(100deg,rgba(35,25,18,.88) 0%,rgba(35,25,18,.35) 60%,rgba(35,25,18,.15) 100%),url('assets/nail-rose.png') center/cover;box-shadow:var(--shadow-md)}
.promo small{font-size:8.5px;letter-spacing:2.4px;font-weight:600;opacity:.85;text-transform:uppercase}
.promo h2{color:#fff;font-size:25px;margin:10px 0;line-height:1.1;letter-spacing:-.02em}
.promo p{font-size:10px;max-width:190px;line-height:1.55;opacity:.9}
.category-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:16px;scrollbar-width:none}
.category-bar::-webkit-scrollbar{display:none}
.category{flex-shrink:0;border:1px solid var(--border-strong);background:var(--surface);padding:9px 16px;border-radius:var(--radius-pill);font-size:10px;font-weight:500;color:var(--muted)}
.category.active{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;border-color:transparent}
.service-list,.professional-list,.appointment-list,.agenda-list{display:flex;flex-direction:column;gap:10px}
.service-row{display:grid;grid-template-columns:58px 1fr 22px;align-items:center;gap:13px;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs)}
.service-photo{width:58px;height:58px;border-radius:14px;background:linear-gradient(145deg,#e8d3b6,#c39a6a);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-family:var(--font-serif);font-size:22px}
.service-info strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.service-info span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.service-info b{display:block;color:var(--gold-deep);font-size:11px;margin-top:6px;font-weight:700}
.service-arrow{color:var(--gold);display:grid;place-items:center}
.professional{display:flex;align-items:center;gap:13px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs)}
.professional-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);display:grid;place-items:center;color:#fff;font-family:var(--font-serif);font-size:22px;font-weight:600}
.professional-info{flex:1}
.professional-info strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.professional-info span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.rating{color:var(--gold-deep);font-size:9.5px;font-weight:600;display:block;margin-top:5px}
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm)}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calendar-header strong{font-family:var(--font-serif);font-size:14px;font-weight:600;text-transform:capitalize}
.calendar-header button{border:1px solid var(--border);background:var(--surface-2);width:32px;height:32px;border-radius:50%;color:var(--gold-deep);display:grid;place-items:center}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week{margin-bottom:10px}
.week span{color:var(--muted-2);font-size:8px;font-weight:700;letter-spacing:.5px}
.days{gap:4px}
.days span{width:32px;height:32px;margin:auto;display:grid;place-items:center;border-radius:50%;font-size:10px;font-weight:500;cursor:pointer}
.days span.selected{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;font-weight:600}
.days span.empty-day{cursor:default}
.time-title{margin:22px 0 12px;font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--ink)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.time-grid button{padding:12px 8px;border:1px solid var(--border-strong);border-radius:13px;background:var(--surface);color:var(--text);font-size:10.5px;font-weight:500}
.time-grid button.selected{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;border-color:transparent}
.payment-summary,.confirmation-card,.appointment-card,.detail-card,.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.payment-summary{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:20px}
.payment-summary .service-photo{width:58px;height:58px}
.payment-summary strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.payment-summary span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px}
.payment-summary b{display:block;color:var(--gold-deep);font-size:12px;margin-top:6px;font-weight:700}
.payment-options{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.payment-option{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.payment-option.selected{border-color:var(--gold);background:linear-gradient(180deg,#fdf8f1,#f9f1e6)}
.payment-option input{accent-color:var(--gold-deep);margin-left:auto;width:18px;height:18px}
.payment-option-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#f6ecdd,#ecdcc5);display:grid;place-items:center;color:var(--gold-dark);font-size:16px}
.payment-option strong{display:block;font-size:11px;font-weight:600;color:var(--ink)}
.payment-option span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.confirmation{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(30px + env(safe-area-inset-top)) 24px calc(110px + env(safe-area-inset-bottom))}
.success-icon{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 60%),linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;display:grid;place-items:center;margin-bottom:22px}
.success-icon .ico{color:#fff}
.confirmation h1{font-size:32px;margin-bottom:12px;line-height:1.1}
.confirmation>p{max-width:295px;color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:22px}
.confirmation-card{width:100%;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:14px;text-align:left;margin-bottom:20px}
.confirmation-card .service-photo{width:58px;height:58px}
.confirmation-card strong,.confirmation-card span{display:block}
.confirmation-card strong{font-size:12px;font-weight:600;color:var(--ink)}
.confirmation-card span{color:var(--muted);font-size:9px;margin-top:4px}
.confirmation-card>b{color:var(--gold-deep);font-size:11px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#ebe0d2;border-radius:var(--radius-pill);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px;border-radius:var(--radius-pill);color:var(--muted);font-size:10px;font-weight:600}
.tabs button.active{background:var(--surface);color:var(--ink)}
.appointment-card{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:12px}
.appointment-card .service-photo{width:58px;height:58px}
.appointment-info strong,.appointment-info span,.appointment-info small{display:block}
.appointment-info strong{font-size:12.5px;font-weight:600;color:var(--ink)}
.appointment-info span{color:var(--muted);font-size:9.5px;margin-top:4px}
.appointment-info small{color:var(--gold-deep);font-size:10px;margin-top:6px;font-weight:700}
.status{font-size:8px;color:var(--green);background:var(--green-bg);padding:5px 9px;border-radius:var(--radius-pill);white-space:nowrap;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.profile-header{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-size:24px;font-weight:600}
.profile-header h2{font-size:19px}
.profile-header p{color:var(--muted);font-size:10.5px;margin-top:4px}
.settings-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.settings-list a,.settings-list button{min-height:56px;width:100%;display:grid;grid-template-columns:26px 1fr 22px;align-items:center;padding:0 16px;gap:4px;border-bottom:1px solid var(--border);background:var(--surface);text-align:left;font-size:12px;color:var(--text);font-weight:500}
.settings-list a:last-child,.settings-list button:last-child{border-bottom:0}
.settings-list a>span:first-child,.settings-list button>span:first-child{color:var(--gold-deep);display:grid;place-items:center}
.settings-list b{grid-column:3;text-align:right;color:var(--muted-2);font-size:16px;font-weight:400}
.settings-list .logout{color:var(--red)}
.pro-login{min-height:100vh;color:#fff;background:radial-gradient(700px 500px at 15% 10%,rgba(196,154,106,.32),transparent 55%),linear-gradient(155deg,#33261e 0%,#1c130d 60%,#0e0906 100%);display:flex;align-items:center}
.pro-auth{width:100%;padding:38px}
.pro-auth h1{color:#f0dcc0;font-size:42px;margin:18px 0 14px;line-height:1.05}
.pro-auth p{color:#b8a596;font-size:12px;max-width:290px;margin-bottom:28px;line-height:1.6}
.pro-auth input{width:100%;height:52px;padding:0 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;outline:0}
.pro-auth input::placeholder{color:#9c8a7c}
.pro-auth .btn{margin-top:10px;background:linear-gradient(180deg,#f5e3c8,#d8b78e);color:#231a14}
.pro-nav,.client-nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;min-height:74px;display:grid;background:rgba(255,253,250,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.pro-nav{grid-template-columns:repeat(5,1fr)}
.client-nav{grid-template-columns:repeat(5,1fr)}
.pro-nav button,.client-nav button{border:0;background:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:14px;padding:6px 2px}
.pro-nav button small,.client-nav button small{font-size:9px;font-weight:600}
.pro-nav button.active,.client-nav button.active{color:var(--ink);background:linear-gradient(180deg,#fbf2e5,#f4e6d1)}
.pro-content{padding:22px 18px calc(112px + env(safe-area-inset-bottom))}
.pro-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:14px}
.pro-head h2{font-size:26px;margin-top:4px}
.pro-head p{color:var(--muted);font-size:10.5px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.stat{padding:14px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.stat span{display:block;color:var(--muted);font-size:8.5px;margin-bottom:8px;font-weight:500}
.stat strong{font-family:var(--font-serif);font-size:20px;color:var(--ink);font-weight:600}
.pro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pro-grid a{min-height:100px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.pro-grid .ico{color:var(--gold-deep);margin-bottom:9px}
.pro-grid strong{font-size:10.5px;font-weight:600;color:var(--ink)}
.next-client{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:10px}
.next-client .profile-avatar{width:46px;height:46px;font-size:18px}

async function syncApiData(){if(!window.BeautyAPI?.isConnected())return;try{const [remoteServices,remotePros,remoteAppointments]=await Promise.all([window.BeautyAPI.services(),window.BeautyAPI.professionals(),window.BeautyAPI.appointments()]);services.splice(0,services.length,...remoteServices.map((s,i)=>{remoteServiceIds[s.name]=s.id;remoteServiceNames[s.id]=s.name;remoteServiceDetails[s.id]=s;return [s.name,s.description,moneyLabel(s.price_cents),['✦','✧','♡','✿','◇','○'][i%6],s.return_days||21]}));remoteProfessionalOptions=remotePros;professionals.splice(0,professionals.length,...remotePros.map(p=>[p.name,'Profissional','Atendimento personalizado',initials(p.name),'4.9']));appointments.splice(0,appointments.length,...remoteAppointments.map(a=>({id:a.id,client:a.client_name||'Cliente',service:remoteServiceNames[a.service_id]||a.service_name||'Serviço',date:String(a.date).split('-').reverse().join('/'),isoDate:a.date,time:a.time,pro:'Jozyhely Rodrigues',price:moneyLabel(a.value_cents),status:{confirmed:'Confirmado',pending:'Pendente',completed:'Concluído',cancelled:'Cancelado'}[a.status]||a.status,old:['completed','cancelled'].includes(a.status),rawStatus:a.status})));remoteNotifications=await window.BeautyAPI.notifications();whatsappPreferences=await window.BeautyAPI.whatsappPreferences();remoteDocuments=await window.BeautyAPI.documents();remoteLoyaltyClient=await window.BeautyAPI.loyaltyMe();remoteMaintenance=await window.BeautyAPI.maintenance();remotePortfolio=await window.BeautyAPI.portfolio();if(!remotePortfolio.length)remotePortfolio=DEMO_PORTFOLIO.map(x=>({...x}));if(state.apiUser?.role==='professional'){remoteInventory=await window.BeautyAPI.inventory();remotePurchases=await window.BeautyAPI.purchases();remoteLoyalty=await window.BeautyAPI.loyaltySettings();remoteClients=await window.BeautyAPI.clients();remoteBusiness=await window.BeautyAPI.businessProfile();remoteOperations=await window.BeautyAPI.operationalReport();remoteOutbox=await window.BeautyAPI.whatsappOutbox();remoteReturns=await window.BeautyAPI.returnReminders();remoteFinance=await window.BeautyAPI.financeTransactions();remoteReport=await window.BeautyAPI.reportSummary();remoteHours=await window.BeautyAPI.hours();remoteBlocks=await window.BeautyAPI.blocks()}}catch(error){console.warn('API indisponível',error)}}
async function loadAvailability(){if(!window.BeautyAPI?.isConnected()||!state.client.service)return;const serviceId=remoteServiceIds[state.client.service];if(!serviceId)return;try{const result=await window.BeautyAPI.availability(state.client.date,serviceId);remoteSlots=result.slots.filter(x=>x.available).map(x=>x.time);if(remoteSlots.length&&!remoteSlots.includes(state.client.time))state.client.time=remoteSlots[0];render()}catch(error){console.warn('Disponibilidade indisponível',error)}}
function monthData(value){const [year,month]=value.split('-').map(Number);const first=new Date(year,month-1,1);const total=new Date(year,month,0).getDate();const offset=first.getDay();const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let day=1;day<=total;day++)cells.push({day,iso:`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`});while(cells.length%7)cells.push(null);return {year,month,cells,title:first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}}
function shiftMonth(delta){const [year,month]=calendarMonth.split('-').map(Number);const date=new Date(year,month-1+delta,1);calendarMonth=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;state.client.date=`${calendarMonth}-01`;state.client.time=null;remoteSlots=null}
async function confirmBooking(){if(!state.client.service||!state.client.professional||!state.client.time){alert('Escolha o serviço, a profissional e o horário antes de continuar.');return}if(state.demoMode){const selected=services.find(s=>s[0]===state.client.service);const item={id:`demo-${Date.now()}`,service:state.client.service,date:String(state.client.date).split('-').reverse().join('/'),isoDate:state.client.date,time:state.client.time,pro:state.client.professional,price:selected?.[2]||'R$ 0,00',status:'Pendente',rawStatus:'pending',old:false};appointments.unshift(item);demoData.appointments=appointments.map(x=>({...x}));saveDemo();state.route='confirmacao';location.hash=state.route;render();return}if(window.BeautyAPI?.isConnected()&&remoteServiceIds[state.client.service]){try{const appointment=await window.BeautyAPI.createAppointment({service_id:remoteServiceIds[state.client.service],date:state.client.date,time:state.client.time,payment_method:state.client.payment,portfolio_id:state.client.portfolioId||null,client_notes:document.querySelector('#booking-notes')?.value||'',custom_answers:{allergies:document.querySelector('#booking-allergies')?.value||''}});for(const extra of state.client.extras){if(remoteServiceIds[extra])await window.BeautyAPI.addAppointmentItem(appointment.id,{service_id:remoteServiceIds[extra],quantity:1})}await window.BeautyAPI.paySandbox(appointment.id);await syncApiData()}catch(error){alert(error.message);return}}state.route='confirmacao';location.hash=state.route;render()}
function renderSchedule(){const availableTimes=remoteSlots||['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];const calendar=monthData(calendarMonth);return `<section class="screen" id="horarios">${clientHeader('Agendamento · etapa 3 de 4')}<main class="content"><div class="page-header"><a href="#profissionais">${icon('chevronL',20)}</a><h2>Escolha o horário</h2><span></span></div><div class="eyebrow" style="margin:15px 0">${esc(state.client.service||'Manicure e Pedicure')} · ${esc(state.client.professional||'sua profissional')}</div><div class="calendar"><div class="calendar-header"><button data-month-prev aria-label="Mês anterior">${icon('chevronL',18)}</button><strong>${calendar.title}</strong><button data-month-next aria-label="Próximo mês">${icon('chevronR',18)}</button></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${calendar.cells.map(cell=>cell?`<span class="${cell.iso===state.client.date?'selected':''}" data-day="${cell.day}" data-date="${cell.iso}">${cell.day}</span>`:'<span class="empty-day"></span>').join('')}</div></div><h3 class="time-title">Horários disponíveis</h3><div class="time-grid">${availableTimes.length?availableTimes.map(t=>`<button class="${t===state.client.time?'selected':''}" data-time="${t}">${t}</button>`).join(''):'<p class="muted" style="grid-column:1/-1;text-align:center;font-size:11px;padding:12px">Nenhum horário disponível para este dia.</p>'}</div><button class="btn" data-route="pagamento">Continuar</button></main></section>`}

async function cancelAppointment(id){if(!confirm('Deseja cancelar este agendamento?'))return;if(state.demoMode){const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true;demoData.appointments=appointments.map(x=>({...x}));saveDemo()}render();return}if(window.BeautyAPI?.isConnected()){try{await window.BeautyAPI.updateAppointment(id,'cancelled');await syncApiData()}catch(error){alert(error.message);return}}const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true}render()}

function renderPublicPreview(){const place=[remoteBusiness.address,remoteBusiness.city,remoteBusiness.state,remoteBusiness.postal_code].filter(Boolean).join(' · ');const visibleServices=services.slice(0,3);return `<section class="screen" id="public-preview"><main class="public-shell"><header class="public-top"><a class="public-back" href="#pro-settings">${icon('chevronL',20)}</a><span class="public-mark">J</span><button class="public-share" type="button" data-public-share>${icon('dots',18)}</button></header><section class="public-hero">${remoteBusiness.photo_url?`<img src="${esc(remoteBusiness.photo_url)}" class="public-photo" alt="Studio">`:'<div class="public-photo public-photo-fallback">J</div>'}<span class="public-eyebrow">AGENDE SEU MOMENTO</span><h1>${esc(remoteBusiness.name||'Seu salão')}</h1><p>${esc(remoteBusiness.tagline||'Beleza que valoriza você')}</p></section><div class="public-main"><section class="public-services"><div class="public-section-head"><div><span class="eyebrow">ESCOLHA SEU CUIDADO</span><h2>Serviços</h2></div><a href="#servicos">Ver todos</a></div><div class="public-service-list">${visibleServices.map(s=>`<div class="public-service"><div><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span></div><b>${esc(s[2])}</b></div>`).join('')}</div></section><a class="public-cta" href="#servicos">Agendar meu horário <span>→</span></a><p class="public-footer">${esc(remoteBusiness.name||'Studio Jozyhely')} · Atendimento com carinho</p></div></main></section>`}
function renderProSettings(){
  const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const byDay={}; for(let i=0;i<7;i++)byDay[i]=[];
  (remoteHours||[]).forEach(h=>{ if(!byDay[h.weekday]) byDay[h.weekday]=[]; byDay[h.weekday].push(h); });
  const blocks=remoteBlocks||[];
  return `<section class="screen" id="pro-settings"><main class="pro-content">${proHead('Configurações','Ajuste o funcionamento do seu salão.')}
    <div class="admin-card"><h3>Horários de atendimento</h3><p>Marque os dias que você trabalha e defina as faixas de horário.</p>
      ${days.map((name,wd)=>{
        const ranges=byDay[wd]; const open=ranges.length>0;
        return `<div data-day-block="${wd}" style="border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:${open?'var(--surface)':'#f8f4ef'}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${open?'10px':'0'}">
            <label style="display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink);font-size:13px">
              <input type="checkbox" data-day-check="${wd}" ${open?'checked':''} style="width:18px;height:18px;accent-color:#a67a45">
              ${name}
            </label>
            <button type="button" data-day-copy="${wd}" style="background:none;border:none;color:var(--gold-deep);font-size:10px;font-weight:600;text-decoration:underline;cursor:pointer">Copiar p/ outros</button>
          </div>
          ${open?ranges.map(r=>`<div style="display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:end">
            <label style="display:block"><span style="display:block;font-size:8px;font-weight:700;color:var(--muted-2);letter-spacing:.5px;margin-bottom:4px">INÍCIO</span><input type="time" data-range-open="${wd}" value="${r.open_time}" style="width:100%;height:38px;border:1px solid var(--border-strong);border-radius:10px;padding:0 8px;font-size:11px"></label>
            <label style="display:block"><span style="display:block;font-size:8px;font-weight:700;color:var(--muted-2);letter-spacing:.5px;margin-bottom:4px">FIM</span><input type="time" data-range-close="${wd}" value="${r.close_time}" style="width:100%;height:38px;border:1px solid var(--border-strong);border-radius:10px;padding:0 8px;font-size:11px"></label>
            <button type="button" data-range-remove="${wd}" data-range-id="${r.id}" style="width:32px;height:38px;border:1px solid #fae0e0;background:#fae0e0;color:#c15b5b;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer">×</button>
          </div>`).join(''):'<div style="color:var(--muted);font-size:11px;padding:6px 0">Fechado</div>'}
          ${open?`<button type="button" data-day-add-range="${wd}" style="background:none;border:1px dashed var(--border-strong);color:var(--gold-deep);font-size:10px;font-weight:600;padding:8px 12px;border-radius:10px;width:100%;cursor:pointer;margin-top:4px">+ Adicionar faixa de horário</button>`:''}
          ${open?`<button type="button" data-day-save="${wd}" style="margin-top:8px;background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;font-size:10px;font-weight:600;padding:9px;border-radius:10px;width:100%;cursor:pointer;letter-spacing:.4px">Salvar ${name}</button>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="admin-card" style="margin-top:16px"><h3>Datas bloqueadas</h3><p>Feriados, férias, folgas. Só o dia, sem mexer no horário da semana.</p>
      <div class="inline"><div class="field"><label>Data</label><input id="block-date" type="date"></div><div class="field"><label>Motivo</label><input id="block-reason" placeholder="Ex.: Natal"></div></div>
      <button type="button" id="block-add-btn" class="btn" style="margin-top:6px">Bloquear data</button>
      <div class="admin-list" style="margin-top:14px">${blocks.map(b=>`<div class="notice"><strong>${String(b.date).split('-').reverse().join('/')}</strong><small>${esc(b.reason||'Bloqueado')}</small><button type="button" class="btn small" data-delete-block="${b.id}" style="margin-top:8px;background:#fae0e0;color:#c15b5b">Remover</button></div>`).join('')||'<div class="notice"><small>Nenhuma data bloqueada.</small></div>'}</div>
    </div>
    <div class="settings-list" style="margin-top:16px"><button class="logout" data-logout>${icon('logout',18)}<span>Sair da área profissional</span><b>${icon('chevronR',16)}</b></button></div>
  </main>${proNav()}</section>`;
}
function render(){const routes={inicio:renderInicio,'cliente-login':renderLogin,'cliente-register':renderRegister,'cliente-forgot':renderForgot,'cliente-home':renderHome,notificacoes:renderNotifications,servicos:renderServices,profissionais:renderProfessionals,horarios:renderSchedule,pagamento:renderPayment,confirmacao:renderConfirmation,agendamentos:renderAppointments,perfil:renderProfile,'public-preview':renderPublicPreview,portfolio:renderPortfolio,'design-builder':renderDesignBuilder,documentos:renderClientDocuments,'profissional-login':renderProLogin,'pro-dashboard':renderProDashboard,'pro-agenda':renderProAgenda,'pro-services':renderProServices,'pro-clients':renderProClients,'pro-reports':renderProReports,'pro-documents':renderProDocuments,'pro-portfolio':renderProPortfolio,'pro-inventory':renderProInventory,'pro-purchases':renderProPurchases,'pro-finance':renderProFinance,'pro-notifications':renderProNotifications,'pro-settings':renderProSettings};const fn=routes[state.route]||renderInicio;let html=fn();if(!html.includes('class="screen active"'))html=html.replace('class="screen"','class="screen active"');document.querySelector('#app').innerHTML=html;bind()}
function bind(){
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.route;location.hash=state.route;render()}));
  document.querySelectorAll('[data-api-login]').forEach(el=>el.addEventListener('click',async()=>{const professional=el.dataset.apiLogin==='professional';const identity=document.querySelector(professional?'#pro-identity':'#client-identity')?.value.trim();const password=document.querySelector(professional?'#pro-password':'#client-password')?.value||'';if(!identity||!password){alert('Informe seus dados de acesso.');return}el.disabled=true;try{const data=await window.BeautyAPI.login(identity,password);state.apiUser=data.user;await syncApiData();state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}catch(error){if(error.offline){state.apiUser={role:professional?'professional':'client',offline:true};state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}else alert(error.message)}finally{el.disabled=false}}));
  document.querySelector('[data-register-submit]')?.addEventListener('click',async()=>{const name=document.querySelector('#register-name')?.value.trim();const email=document.querySelector('#register-email')?.value.trim();const phone=document.querySelector('#register-phone')?.value.trim();const password=document.querySelector('#register-password')?.value||'';if(!name||!email||password.length<6){alert('Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.');return}try{await window.BeautyAPI.register({name,email,phone,password});const data=await window.BeautyAPI.login(email,password);state.apiUser=data.user;await syncApiData();state.route='cliente-home';location.hash=state.route;render()}catch(error){alert(error.message)}});
  document.querySelector('[data-reset-request]')?.addEventListener('click',async()=>{const email=document.querySelector('#reset-email')?.value.trim();if(!email){alert('Informe seu e-mail.');return}try{const result=await window.BeautyAPI.requestPasswordReset(email);alert(result.message)}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-pro-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.proRoute;state.proTab=el.dataset.proRoute.replace('pro-','');location.hash=state.route;render()}));
  document.querySelectorAll('[data-service]').forEach(el=>el.addEventListener('click',()=>{state.client.service=el.dataset.service;remoteSlots=null}));
  document.querySelectorAll('[data-pro]').forEach(el=>el.addEventListener('click',()=>{state.client.professional=el.dataset.pro;remoteSlots=null;loadAvailability()}));
  document.querySelectorAll('[data-time]').forEach(el=>el.addEventListener('click',()=>{state.client.time=el.dataset.time;render()}));
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('[data-day]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.client.date=el.dataset.date;remoteSlots=null;loadAvailability()}));
  document.querySelector('[data-month-prev]')?.addEventListener('click',()=>{shiftMonth(-1);render()});
  document.querySelector('[data-month-next]')?.addEventListener('click',()=>{shiftMonth(1);render()});
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render()}));
  document.querySelectorAll('.category').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));el.classList.add('active')}));
  document.querySelectorAll('[data-extra-service]').forEach(el=>el.addEventListener('change',()=>{const name=el.dataset.extraService;if(el.checked&&!state.client.extras.includes(name))state.client.extras.push(name);if(!el.checked)state.client.extras=state.client.extras.filter(x=>x!==name)}));
  document.querySelectorAll('.payment-option').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const input=el.querySelector('input');input.checked=true;state.client.payment=input.value}));
  document.querySelector('[data-confirm-booking]')?.addEventListener('click',confirmBooking);
  document.querySelector('#service-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.service-row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});
  document.querySelector('#client-search')?.addEventListener('input',async e=>{try{remoteClients=await window.BeautyAPI.clients(e.target.value.trim());render()}catch(error){}});
  document.querySelectorAll('[data-notification]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.markNotificationRead(el.dataset.notification);el.style.opacity='.55'}catch(error){}}));
  document.querySelectorAll('[data-reschedule]').forEach(el=>el.addEventListener('click',()=>rescheduleAppointment(el.dataset.reschedule)));
  document.querySelectorAll('[data-cancel]').forEach(el=>el.addEventListener('click',()=>cancelAppointment(el.dataset.cancel)));
  document.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click',async()=>{try{if(window.BeautyAPI?.isConnected())await window.BeautyAPI.logout()}finally{state.apiUser=null;state.demoMode=false;state.route='inicio';location.hash='inicio';render()}}));
  document.querySelector('#finance-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{await window.BeautyAPI.addTransaction({type:data.get('type'),description:data.get('description'),amount_cents:Math.round(Number(String(data.get('amount')).replace(',','.'))*100),date:data.get('date')});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('#inventory-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{await window.BeautyAPI.createInventory({name:d.get('name'),category:d.get('category'),quantity:Number(d.get('quantity')||0),minimum_quantity:Number(d.get('minimum_quantity')||0),unit:d.get('unit'),cost_cents:Math.round(Number(d.get('cost')||0)*100),active:true});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('#report-filter')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{remoteOperations=await window.BeautyAPI.operationalReport({start:data.get('start'),end:data.get('end')});render()}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-portfolio-delete]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir este trabalho?'))return;try{await window.BeautyAPI.deletePortfolio(el.dataset.portfolioDelete);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-client-toggle]').forEach(el=>el.addEventListener('click',async()=>{const blocked=el.dataset.blocked!=='1';try{await window.BeautyAPI.updateClientProfile(el.dataset.clientToggle,{blocked});await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelector('[data-add-service]')?.addEventListener('click',async()=>{const name=prompt('Nome do serviço');if(!name)return;const price=prompt('Preço em reais','50');const duration=prompt('Duração em minutos','60');const returnDays=prompt('Avisar a profissional após quantos dias para refazer?','21');try{await window.BeautyAPI.createService({name,description:'Novo serviço cadastrado',price_cents:Math.round(Number(String(price).replace(',','.'))*100),duration_min:Number(duration),return_days:Number(returnDays)||21,active:true});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('[data-public-share]')?.addEventListener('click',async()=>{const data={title:remoteBusiness.name||'Studio Jozyhely',text:remoteBusiness.tagline||'Agende seu horário'};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);alert('Link copiado.')}catch(error){}});
  document.querySelectorAll('[data-day-check]').forEach(el=>el.addEventListener('change',async()=>{
    const wd=Number(el.dataset.dayCheck); const block=el.closest('[data-day-block]');
    if(el.checked){
      const opens=[...block.querySelectorAll('[data-range-open]')];
      const closes=[...block.querySelectorAll('[data-range-close]')];
      const ranges=opens.length?opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value})):[{open_time:'09:00',close_time:'18:00'}];
      try{await window.BeautyAPI.saveDay(wd,ranges);await syncApiData();render()}catch(error){alert(error.message)}
    } else {
      if(!confirm('Fechar este dia? Os agendamentos existentes não são cancelados.')){el.checked=true;return}
      try{await window.BeautyAPI.saveDay(wd,[]);await syncApiData();render()}catch(error){alert(error.message)}
    }
  }));
  document.querySelectorAll('[data-day-add-range]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.dayAddRange); const block=el.closest('[data-day-block]');
    const opens=[...block.querySelectorAll('[data-range-open]')];
    const closes=[...block.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value}));
    ranges.push({open_time:'14:00',close_time:'18:00'});
    try{await window.BeautyAPI.saveDay(wd,ranges);await syncApiData();render()}catch(error){alert(error.message)}
  }));
  document.querySelectorAll('[data-range-remove]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.rangeRemove); const removeId=el.dataset.rangeId;
    const block=el.closest('[data-day-block]');
    const opens=[...block.querySelectorAll('[data-range-open]')];
    const closes=[...block.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value,_id:i.dataset.rangeOpen||idx})).filter(r=>String(r._id)!==String(removeId));
    try{await window.BeautyAPI.saveDay(wd,ranges.map(r=>({open_time:r.open_time,close_time:r.close_time})));await syncApiData();render()}catch(error){alert(error.message)}
  }));
  document.querySelectorAll('[data-day-save]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.daySave); const block=el.closest('[data-day-block]');
    const opens=[...block.querySelectorAll('[data-range-open]')];
    const closes=[...block.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value}));
    try{await window.BeautyAPI.saveDay(wd,ranges);alert('Horários salvos!');await syncApiData();render()}catch(error){alert(error.message)}
  }));
  document.querySelectorAll('[data-day-copy]').forEach(el=>el.addEventListener('click',async()=>{
    const from=Number(el.dataset.dayCopy); const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const input=prompt(`Copiar horários de ${days[from]} para quais dias?\n0=Dom 1=Seg 2=Ter 3=Qua 4=Qui 5=Sex 6=Sáb\nSepare por vírgula. Ex: 1,2,3`,'');
    if(!input)return;
    const to=input.split(',').map(x=>Number(x.trim())).filter(n=>!isNaN(n)&&n>=0&&n<=6&&n!==from);
    if(!to.length)return;
    try{await window.BeautyAPI.copyDay(from,to);await syncApiData();render()}catch(error){alert(error.message)}
  }));
  document.querySelector('#block-add-btn')?.addEventListener('click',async()=>{
    const date=document.querySelector('#block-date')?.value;
    const reason=document.querySelector('#block-reason')?.value.trim()||null;
    if(!date){alert('Escolha uma data.');return}
    try{await window.BeautyAPI.createBlock({date,reason});await syncApiData();render()}catch(error){alert(error.message)}
  });
  document.querySelectorAll('[data-delete-block]').forEach(el=>el.addEventListener('click',async()=>{
    try{await window.BeautyAPI.deleteBlock(el.dataset.deleteBlock);await syncApiData();render()}catch(error){alert(error.message)}
  }));
}
window.addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'inicio';render()});
state.route=location.hash.slice(1)||'inicio';
render();
</script>
