<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NailAgenda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fdf2f8;
    color: #333;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 { color: #db2777; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(219, 39, 119, 0.08);
  }
  h2 { color: #db2777; font-size: 18px; margin-bottom: 12px; }
  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #fce7f3;
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: #db2777; }
  button {
    width: 100%;
    padding: 12px;
    background: #db2777;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #be185d; }
  button:disabled { background: #f9a8d4; cursor: not-allowed; }
  .service-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #fce7f3;
  }
  .service-item:last-child { border-bottom: none; }
  .service-name { font-weight: 600; }
  .service-meta { font-size: 13px; color: #888; }
  .service-price { color: #db2777; font-weight: 700; }
  .hidden { display: none; }
  .msg { padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
  .msg-ok { background: #dcfce7; color: #166534; }
  .msg-err { background: #fee2e2; color: #991b1b; }
  .user-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; background: #fce7f3; border-radius: 10px; margin-bottom: 16px;
  }
  .user-bar span { font-size: 14px; color: #831843; }
  .link-btn {
    background: none; border: none; color: #db2777;
    font-size: 14px; text-decoration: underline; cursor: pointer; width: auto; padding: 0;
  }
</style>
</head>
<body>

<h1>💅 NailAgenda</h1>
<p class="subtitle">Agendamento para nail designers</p>

<!-- MENSAGENS -->
<div id="msg"></div>

<!-- BARRA DO USUÁRIO LOGADO -->
<div id="userBar" class="user-bar hidden">
  <span id="userEmail"></span>
  <button class="link-btn" onclick="logout()">Sair</button>
</div>

<!-- TELA DE LOGIN / CADASTRO -->
<div id="authBox" class="card">
  <h2 id="authTitle">Entrar</h2>
  <input type="email" id="email" placeholder="E-mail" autocomplete="email">
  <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
  <button id="authBtn" onclick="handleAuth()">Entrar</button>
  <p style="text-align:center; margin-top:12px; font-size:14px; color:#888;">
    <a href="#" onclick="toggleAuth(); return false;" id="toggleLink">Não tenho conta — Criar agora</a>
  </p>
</div>

<!-- SERVIÇOS -->
<div id="servicesBox" class="card hidden">
  <h2>Nossos Serviços</h2>
  <div id="servicesList"></div>
</div>

<!-- NOVO AGENDAMENTO -->
<div id="bookingBox" class="card hidden">
  <h2>Novo Agendamento</h2>
  <input type="text" id="clientName" placeholder="Seu nome">
  <input type="tel" id="clientPhone" placeholder="Seu WhatsApp (opcional)">
  <select id="serviceSelect">
    <option value="">Escolha um serviço...</option>
  </select>
  <input type="datetime-local" id="startTime">
  <button onclick="createAppointment()">Agendar</button>
</div>

<!-- MEUS AGENDAMENTOS -->
<div id="appointmentsBox" class="card hidden">
  <h2>Meus Agendamentos</h2>
  <div id="appointmentsList"><p style="color:#888; font-size:14px;">Nenhum agendamento ainda.</p></div>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// ============================================================
const SUPABASE_URL = 'https://jibhejkxuxarhvuujgac.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ny9ydDIYrR17x5RkEYJGyw_GEZSEzAK';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isSignUp = false;
let servicesCache = [];

// ============================================================
// UTILITÁRIOS
// ============================================================
function showMsg(text, type = 'ok') {
  const el = document.getElementById('msg');
  el.className = 'msg msg-' + type;
  el.textContent = text;
  setTimeout(() => { el.className = ''; el.textContent = ''; }, 4000);
}

function toggleAuth() {
  isSignUp = !isSignUp;
  document.getElementById('authTitle').textContent = isSignUp ? 'Criar Conta' : 'Entrar';
  document.getElementById('authBtn').textContent = isSignUp ? 'Criar Conta' : 'Entrar';
  document.getElementById('toggleLink').textContent = isSignUp
    ? 'Já tenho conta — Entrar'
    : 'Não tenho conta — Criar agora';
}

// ============================================================
// AUTENTICAÇÃO
// ============================================================
async function handleAuth() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) { showMsg('Preencha e-mail e senha.', 'err'); return; }
  if (password.length < 6) { showMsg('Senha precisa ter 6+ caracteres.', 'err'); return; }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = 'Aguarde...';

  try {
    const { data, error } = isSignUp
      ? await supabase.auth.signUp({ email, password })
      : await supabase.auth.signInWithPassword({ email, password });

    if (error) throw error;

    if (isSignUp && !data.session) {
      showMsg('Conta criada! Verifique seu e-mail para confirmar.', 'ok');
    } else {
      showMsg('Bem-vindo(a)! 💅', 'ok');
    }
  } catch (err) {
    showMsg(err.message || 'Erro na autenticação.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = isSignUp ? 'Criar Conta' : 'Entrar';
  }
}

async function logout() {
  await supabase.auth.signOut();
  showMsg('Você saiu.', 'ok');
}

// ============================================================
// CONTROLE DE TELA (mostrar/ocultar)
// ============================================================
function updateUI(session) {
  const logged = !!session;
  document.getElementById('authBox').classList.toggle('hidden', logged);
  document.getElementById('servicesBox').classList.toggle('hidden', !logged);
  document.getElementById('bookingBox').classList.toggle('hidden', !logged);
  document.getElementById('appointmentsBox').classList.toggle('hidden', !logged);
  document.getElementById('userBar').classList.toggle('hidden', !logged);

  if (logged) {
    document.getElementById('userEmail').textContent = session.user.email;
    loadServices();
    loadAppointments();
  }
}

// ============================================================
// SERVIÇOS
// ============================================================
async function loadServices() {
  const { data, error } = await supabase
    .from('services')
    .select('*')
    .eq('is_active', true)
    .order('name');

  if (error) { showMsg('Erro ao carregar serviços.', 'err'); return; }

  servicesCache = data || [];

  const list = document.getElementById('servicesList');
  const select = document.getElementById('serviceSelect');

  if (!servicesCache.length) {
    list.innerHTML = '<p style="color:#888; font-size:14px;">Nenhum serviço cadastrado.</p>';
    return;
  }

  list.innerHTML = servicesCache.map(s => `
    <div class="service-item">
      <div>
        <div class="service-name">${s.name}</div>
        <div class="service-meta">${s.duration_minutes} min</div>
      </div>
      <div class="service-price">R$ ${Number(s.price).toFixed(2)}</div>
    </div>
  `).join('');

  select.innerHTML = '<option value="">Escolha um serviço...</option>' +
    servicesCache.map(s => `<option value="${s.id}">${s.name} — R$ ${Number(s.price).toFixed(2)}</option>`).join('');
}

// ============================================================
// AGENDAMENTOS
// ============================================================
async function createAppointment() {
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const serviceId = document.getElementById('serviceSelect').value;
  const startTime = document.getElementById('startTime').value;

  if (!name || !serviceId || !startTime) {
    showMsg('Preencha nome, serviço e data/hora.', 'err');
    return;
  }

  const service = servicesCache.find(s => s.id === serviceId);
  if (!service) { showMsg('Serviço inválido.', 'err'); return; }

  const start = new Date(startTime);
  const end = new Date(start.getTime() + service.duration_minutes * 60000);

  const { data: userData } = await supabase.auth.getUser();

  const { error } = await supabase.from('appointments').insert({
    client_id: userData.user.id,
    client_name: name,
    client_phone: phone || null,
    service_id: serviceId,
    start_time: start.toISOString(),
    end_time: end.toISOString(),
    status: 'pending',
    total: service.price
  });

  if (error) {
    showMsg('Erro ao agendar: ' + error.message, 'err');
    return;
  }

  showMsg('Agendamento criado! 💅', 'ok');
  document.getElementById('clientName').value = '';
  document.getElementById('clientPhone').value = '';
  document.getElementById('serviceSelect').value = '';
  document.getElementById('startTime').value = '';
  loadAppointments();
}

async function loadAppointments() {
  const { data: userData } = await supabase.auth.getUser();
  if (!userData?.user) return;

  const { data, error } = await supabase
    .from('appointments')
    .select(`*, services (name, price)`)
    .eq('client_id', userData.user.id)
    .order('start_time', { ascending: false });

  if (error) { console.error(error); return; }

  const list = document.getElementById('appointmentsList');

  if (!data || !data.length) {
    list.innerHTML = '<p style="color:#888; font-size:14px;">Nenhum agendamento ainda.</p>';
    return;
  }

  list.innerHTML = data.map(a => {
    const dt = new Date(a.start_time).toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    const statusMap = {
      pending: '⏳ Pendente',
      confirmed: '✅ Confirmado',
      completed: '💅 Concluído',
      canceled: '❌ Cancelado',
      no_show: '⚠️ Não compareceu'
    };
    return `
      <div class="service-item">
        <div>
          <div class="service-name">${a.services?.name || 'Serviço'}</div>
          <div class="service-meta">${dt}</div>
        </div>
        <div class="service-meta">${statusMap[a.status] || a.status}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
supabase.auth.onAuthStateChange((_event, session) => {
  updateUI(session);
});

supabase.auth.getSession().then(({ data }) => {
  updateUI(data.session);
});
</script>

</body>
</html>
