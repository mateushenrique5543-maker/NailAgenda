/* APP DO TIME — tema visual aplicado ao Beauty Salon */
:root{--bg:#f7f3ef;--soft:#f7f3ef;--surface:#fffdfb;--white:#fffdfb;--dark:#181310;--dark2:#29211d;--brown:#29231f;--brown2:#705746;--text:#29231f;--muted:#8b7e74;--gold:#b88a57;--gold2:#d9bc99;--gold3:#e8ddd4;--border:#e8ddd4;--line:#e8ddd4;--shadow:0 10px 30px rgba(30,20,12,.08)}
body{background:#dfd2c7;color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{background:var(--bg);box-shadow:none}
.screen{background:var(--bg)}
h1,h2,h3,.title,.page-header h2{font-family:Georgia,serif;color:var(--text)}
.top-header,.page-header{background:rgba(255,253,251,.97);border-color:var(--line)}
.top-header{box-shadow:0 1px 0 var(--line)}
.header-title strong{font-family:Georgia,serif;font-size:16px;color:var(--text)}
.header-title span,.muted{color:var(--muted)}
.avatar,.professional-avatar,.brand-symbol{background:#ead9c7;color:var(--text);box-shadow:none}
.header-action{background:var(--surface);border-color:var(--line);color:var(--text);box-shadow:none}
.btn{background:var(--dark);color:#fff;box-shadow:none;border-radius:13px}
.btn:hover{background:var(--dark2);filter:none}
.btn.outline{background:#f0e6de;color:var(--text);border-color:transparent}
.btn.danger{background:#fff0f0;color:#b84e4e}
.btn.small{border-radius:9px}
.card,.admin-card,.confirmation-card,.maintenance-card,.settings-list,.payment-summary,.public-info-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.section-title{margin:20px 0 10px}.section-title h2{font-size:18px}.section-title a{color:var(--gold);font-weight:700}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:none}.stat strong{color:var(--text)}
.service-row,.admin-row,.notice,.professional{background:var(--surface);border-color:var(--line);border-radius:16px}
.service-row{box-shadow:none}.service-info small,.service-info span,.professional-info small{color:var(--muted)}
.service-photo{background:#ead9c7;border-radius:14px}
.client-nav,.pro-nav{background:rgba(255,253,251,.97);border-top:1px solid var(--line);box-shadow:none}
.client-nav a,.pro-nav a{color:var(--muted)}
.client-nav a.active,.pro-nav a.active{color:var(--dark);font-weight:700}
.login-screen{background:radial-gradient(circle at 90% 10%,#4c392c 0,#241b17 35%,#120f0d 80%);color:#fff}
.login-box{color:#fff}.brand-name{color:var(--gold2)}.brand-subtitle,.welcome-text,.welcome p{color:#c5b9b0}
.brand-symbol{border:1px solid var(--gold2);background:transparent;color:var(--gold2);font-family:Georgia,serif}
.login-photo{display:none}
.field label{color:var(--muted)}.login-screen input{background:#241c18;color:#fff;border-color:#4a3b32}
input,select,textarea{background:#fff;color:var(--text);border-color:var(--line)}
.public-hero{background:linear-gradient(135deg,#2d241f,#151210);color:#fff}.public-hero h1,.public-hero p{color:#fff}
.public-info-icon{background:#ead9c7;color:var(--text)}

function renderHome(){const maintenance=remoteMaintenance.find(x=>x.state==='overdue'||x.state==='today'||x.days_until<=3);return `<section class="screen" id="cliente-home">${clientHeader()}<main class="content"><div class="welcome"><span class="eyebrow">BEM-VINDA, ${state.client.name.toUpperCase()}</span><h1>Que bom ter<br>você aqui.</h1><p>Um momento de cuidado pensado para você.</p></div><div class="quick-actions"><a class="quick-card" href="#servicos"><span>✦</span><strong>Agendar</strong></a><a class="quick-card" href="#portfolio"><span>▧</span><strong>Portfólio</strong></a><a class="quick-card" href="#design-builder"><span>◇</span><strong>Monte sua unha</strong></a><a class="quick-card" href="#agendamentos"><span>▣</span><strong>Agendamentos</strong></a><a class="quick-card" href="#documentos"><span>✎</span><strong>Documentos</strong></a><a class="quick-card" href="#perfil"><span>•••</span><strong>Meu perfil</strong></a></div>${maintenance?`<a class="maintenance-card" href="#servicos"><span>↻</span><div><strong>Hora da manutenção</strong><small>Está chegando o momento do seu próximo cuidado.</small></div><b>›</b></a>`:''}<div class="section-title"><h2>Cuide de você</h2><a href="#servicos">Ver tudo</a></div><div class="promo"><small>EXPERIÊNCIA JOZYHELY</small><h2>Beleza em<br>todos os detalhes.</h2><p>Agende seu próximo momento de autocuidado.</p></div><div class="section-title"><h2>Serviço em destaque</h2></div><a class="service-row" href="#servicos">${servicePhoto(services[0]?.[0]||'Nail Design','✦')}<div class="service-info"><strong>${esc(services[0]?.[0]||'Nail Design')}</strong><span>${esc(services[0]?.[1]||'Acabamento delicado e completo')}</span><b>A partir de ${services[0]?.[2]||'R$ 0,00'}</b></div><span class="service-arrow">›</span></a></main>${bottom('home')}</section>`}

function moneyLabel(cents){return `R$ ${(Number(cents||0)/100).toFixed(2).replace('.',',')}`}
function initials(name){return String(name||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'J'}
async function syncApiData(){if(!window.BeautyAPI?.isConnected())return;try{const [remoteServices,remotePros,remoteAppointments]=await Promise.all([window.BeautyAPI.services(),window.BeautyAPI.professionals(),window.BeautyAPI.appointments()]);services.splice(0,services.length,...remoteServices.map((s,i)=>{remoteServiceIds[s.name]=s.id;remoteServiceNames[s.id]=s.name;remoteServiceDetails[s.id]=s;return [s.name,s.description,moneyLabel(s.price_cents),['✦','✧','♡','✿','◇','○'][i%6],s.return_days||21]}));remoteProfessionalOptions=remotePros;professionals.splice(0,professionals.length,...remotePros.map(p=>[p.name,'Profissional','Atendimento personalizado',initials(p.name),'4.9']));appointments.splice(0,appointments.length,...remoteAppointments.map(a=>({id:a.id,client:a.client_name||'Cliente',service:remoteServiceNames[a.service_id]||a.service_name||'Serviço',date:String(a.date).split('-').reverse().join('/'),isoDate:a.date,time:a.time,pro:'Jozyhely Rodrigues',price:moneyLabel(a.value_cents),status:{confirmed:'Confirmado',pending:'Pendente',completed:'Concluído',cancelled:'Cancelado'}[a.status]||a.status,old:['completed','cancelled'].includes(a.status),rawStatus:a.status})));remoteNotifications=await window.BeautyAPI.notifications();whatsappPreferences=await window.BeautyAPI.whatsappPreferences();remoteDocuments=await window.BeautyAPI.documents();remoteLoyaltyClient=await window.BeautyAPI.loyaltyMe();remoteMaintenance=await window.BeautyAPI.maintenance();remotePortfolio=await window.BeautyAPI.portfolio();if(!remotePortfolio.length)remotePortfolio=DEMO_PORTFOLIO.map(x=>({...x}));if(state.apiUser?.role==='professional'){remoteInventory=await window.BeautyAPI.inventory();remotePurchases=await window.BeautyAPI.purchases();remoteLoyalty=await window.BeautyAPI.loyaltySettings();remoteClients=await window.BeautyAPI.clients();remoteBusiness=await window.BeautyAPI.businessProfile();remoteOperations=await window.BeautyAPI.operationalReport();remoteOutbox=await window.BeautyAPI.whatsappOutbox();remoteReturns=await window.BeautyAPI.returnReminders();remoteFinance=await window.BeautyAPI.financeTransactions();remoteReport=await window.BeautyAPI.reportSummary();remoteHours=await window.BeautyAPI.hours();remoteBlocks=await window.BeautyAPI.blocks();}}catch(error){console.warn('API indisponível; dados demonstrativos mantidos',error)}}
async function loadAvailability(){if(!window.BeautyAPI?.isConnected()||!state.client.service)return;const serviceId=remoteServiceIds[state.client.service];if(!serviceId)return;try{const result=await window.BeautyAPI.availability(state.client.date,serviceId);remoteSlots=result.slots.filter(x=>x.available).map(x=>x.time);if(remoteSlots.length&&!remoteSlots.includes(state.client.time))state.client.time=remoteSlots[0];render()}catch(error){console.warn('Disponibilidade remota indisponível',error)}}
function monthData(value){const [year,month]=value.split('-').map(Number);const first=new Date(year,month-1,1);const total=new Date(year,month,0).getDate();const offset=first.getDay();const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let day=1;day<=total;day++)cells.push({day,iso:`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`});while(cells.length%7)cells.push(null);return {year,month,cells,title:first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}}
function shiftMonth(delta){const [year,month]=calendarMonth.split('-').map(Number);const date=new Date(year,month-1+delta,1);calendarMonth=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;state.client.date=`${calendarMonth}-01`;state.client.time=null;remoteSlots=null}
async function confirmBooking(){if(!state.client.service||!state.client.professional||!state.client.time){alert('Escolha o serviço, a profissional e o horário antes de continuar.');return}if(state.demoMode){const selected=services.find(s=>s[0]===state.client.service);const item={id:`demo-${Date.now()}`,service:state.client.service,date:String(state.client.date).split('-').reverse().join('/'),isoDate:state.client.date,time:state.client.time,pro:state.client.professional,price:selected?.[2]||'R$ 0,00',status:'Pendente',rawStatus:'pending',old:false};appointments.unshift(item);demoData.appointments=appointments.map(x=>({...x}));saveDemo();state.route='confirmacao';location.hash=state.route;render();return}if(window.BeautyAPI?.isConnected()&&remoteServiceIds[state.client.service]){try{const appointment=await window.BeautyAPI.createAppointment({service_id:remoteServiceIds[state.client.service],date:state.client.date,time:state.client.time,payment_method:state.client.payment,portfolio_id:state.client.portfolioId||null,client_notes:document.querySelector('#booking-notes')?.value||'',custom_answers:{allergies:document.querySelector('#booking-allergies')?.value||''}});for(const extra of state.client.extras){if(remoteServiceIds[extra])await window.BeautyAPI.addAppointmentItem(appointment.id,{service_id:remoteServiceIds[extra],quantity:1})}await window.BeautyAPI.paySandbox(appointment.id);await syncApiData()}catch(error){alert(error.message);return}}state.route='confirmacao';location.hash=state.route;render()}
function renderSchedule(){const availableTimes=remoteSlots||['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];const calendar=monthData(calendarMonth);return `<section class="screen" id="horarios">${clientHeader('Agendamento · etapa 3 de 4')}<main class="content"><div class="page-header" style="margin:0 -18px 15px"><a href="#profissionais">‹</a><h2>Escolha o horário</h2><span></span></div><div class="eyebrow" style="margin:15px 0">${esc(state.client.service||'Manicure e Pedicure')} · ${esc(state.client.professional||'sua profissional')}</div><div class="calendar"><div class="calendar-header"><button data-month-prev aria-label="Mês anterior">‹</button><strong>${calendar.title}</strong><button data-month-next aria-label="Próximo mês">›</button></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${calendar.cells.map(cell=>cell?`<span class="${cell.iso===state.client.date?'selected':''}" data-day="${cell.day}" data-date="${cell.iso}">${cell.day}</span>`:'<span class="empty-day"></span>').join('')}</div></div><h3 class="time-title">Horários disponíveis</h3><div class="time-grid">${availableTimes.length?availableTimes.map(t=>`<button class="${t===state.client.time?'selected':''}" data-time="${t}">${t}</button>`).join(''):'<p class="muted" style="grid-column:1/-1;text-align:center;font-size:11px;padding:12px">Nenhum horário disponível para este dia.</p>'}</div><button class="btn" data-route="pagamento">Continuar</button></main></section>`}
function renderPayment(){const selected=[state.client.service,...(state.client.extras||[])];const totalCents=selected.reduce((sum,name)=>{const s=services.find(x=>x[0]===name);return sum+(s?Math.round(Number(String(s[2]).replace(/[^0-9,]/g,'').replace(',','.'))*100):0)},0);return `<section class="screen" id="pagamento">${clientHeader('Agendamento · pagamento')}<main class="content"><div class="page-header" style="margin:0 -18px 15px"><a href="#horarios">‹</a><h2>Pagamento</h2><span></span></div><div class="payment-summary">${servicePhoto(state.client.service||'Nail Design','✦')}<div><strong>${esc(state.client.service||'Manicure e Pedicure')}</strong><span>${esc(state.client.professional||'Bruna Costa')} · ${String(state.client.date).split('-').reverse().join('/')} às ${state.client.time}</span><b>${moneyLabel(totalCents)}</b></div></div><div class="eyebrow" style="margin:20px 0 10px">Forma de pagamento</div><div class="payment-options"><label class="payment-option selected"><div class="payment-option-icon">⌁</div><div><strong>PIX</strong><span>Pagamento instantâneo</span></div><input type="radio" name="pay" value="pix" checked></label><label class="payment-option"><div class="payment-option-icon">▱</div><div><strong>Cartão</strong><span>Crédito ou débito</span></div><input type="radio" name="pay" value="card"></label><label class="payment-option"><div class="payment-option-icon">$</div><div><strong>Dinheiro</strong><span>Pagamento no atendimento</span></div><input type="radio" name="pay" value="cash"></label><label class="payment-option"><div class="payment-option-icon">＋</div><div><strong>Outro</strong><span>Combinar com o Studio</span></div><input type="radio" name="pay" value="other"></label></div><div class="admin-card" style="margin-bottom:18px"><h3 style="font-size:15px">Adicionar outro serviço</h3><p style="font-size:10px;color:var(--muted);margin:5px 0 10px">Opcional</p>${services.filter(s=>s[0]!==state.client.service).slice(0,3).map(s=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 0;font-size:10px"><input type="checkbox" data-extra-service="${esc(s[0])}" ${state.client.extras.includes(s[0])?'checked':''}>${esc(s[0])} · ${s[2]}</label>`).join('')}</div><div class="admin-card" style="margin-bottom:18px"><h3>Informações do atendimento</h3><p style="font-size:10px;color:var(--muted);margin:5px 0 10px">Opcional — ajuda a profissional a se preparar.</p><div class="field"><label>Observações ou preferências</label><input id="booking-notes" placeholder="Ex.: preferência de cor"></div><div class="field"><label>Alergias ou sensibilidades</label><input id="booking-allergies" placeholder="Se houver, informe aqui"></div></div><button class="btn" data-confirm-booking>Confirmar agendamento</button></main></section>`}
function renderConfirmation(){const selected=[state.client.service,...(state.client.extras||[])].filter(Boolean);const total=selected.reduce((sum,name)=>{const s=services.find(x=>x[0]===name);return sum+(s?Number(String(s[2]).replace(/[^0-9,]/g,'').replace(',','.')):0)},0);const date=String(state.client.date||'').split('-').reverse().join('/');return `<section class="screen confirmation" id="confirmacao"><div class="success-icon">✓</div><span class="eyebrow">TUDO CERTO</span><h1>Agendamento<br>confirmado!</h1><p>Seu horário foi reservado. Enviamos os detalhes para você acompanhar pelo app.</p><div class="confirmation-card">${servicePhoto(state.client.service||'Nail Design','✦')}<div><strong>${esc(state.client.service||'Manicure e Pedicure')}</strong><span>${date} · ${state.client.time} · ${esc(state.client.professional||'Jozyhely Rodrigues')}</span></div><b>${moneyLabel(Math.round(total*100))}</b></div><button class="btn" data-route="agendamentos">Ver meus agendamentos</button><a href="#cliente-home" style="font-size:11px;color:var(--gold2);margin-top:16px">Voltar para o início</a></section>`}
function renderAppointments(){let list=state.tab==='upcoming'?appointments.filter(x=>!x.old):appointments.filter(x=>x.old);return `<section class="screen" id="agendamentos">${clientHeader('Seus horários')}<main class="content"><div class="page-header" style="margin:0 -18px 15px"><a href="#cliente-home">‹</a><h2>Agendamentos</h2><span></span></div><div class="tabs"><button class="${state.tab==='upcoming'?'active':''}" data-tab="upcoming">Próximos</button><button class="${state.tab==='history'?'active':''}" data-tab="history">Histórico</button></div><div class="appointment-list">${list.map(a=>`<article class="appointment-card">${servicePhoto(a.service,'✦')}<div class="appointment-info"><strong>${a.service}</strong><span>${a.date} · ${a.time}<br>${a.pro}</span><small>${a.price}</small></div><div><em class="status">${a.status}</em>${!a.old&&a.id?`<button class="btn small" style="margin-top:6px;background:#f4eadf;color:var(--gold2);box-shadow:none" data-reschedule="${a.id}">Reagendar</button><button class="btn small" style="margin-top:6px;background:var(--red-bg);color:var(--red);box-shadow:none" data-cancel="${a.id}">Cancelar</button>`:''}</div></article>`).join('')||'<div class="admin-card" style="padding:25px;text-align:center;color:var(--muted);font-size:12px">Nenhum agendamento nesta categoria.</div>'}</div></main>${bottom('appointments')}</section>`}
async function rescheduleAppointment(id){const date=prompt('Nova data (AAAA-MM-DD)','2026-09-18');const time=prompt('Novo horário (HH:MM)','14:00');if(!date||!time)return;try{if(state.demoMode){const item=appointments.find(x=>String(x.id)===String(id));if(item){item.date=date.split('-').reverse().join('/');item.isoDate=date;item.time=time;demoData.appointments=appointments.map(x=>({...x}));saveDemo()}render();return}if(window.BeautyAPI?.isConnected()){await window.BeautyAPI.rescheduleAppointment(id,date,time);await syncApiData()}const item=appointments.find(x=>String(x.id)===String(id));if(item){item.date=date.split('-').reverse().join('/');item.time=time}render();}catch(error){alert(error.message)}}
async function cancelAppointment(id){if(!confirm('Deseja cancelar este agendamento?'))return;if(state.demoMode){const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true;demoData.appointments=appointments.map(x=>({...x}));saveDemo()}render();return}if(window.BeautyAPI?.isConnected()){try{await window.BeautyAPI.updateAppointment(id,'cancelled');await syncApiData()}catch(error){alert(error.message);return}}const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true}render()}
function renderNotifications(){return `<section class="screen" id="notificacoes">${clientHeader('Avisos e atualizações')}<main class="content"><div class="page-header" style="margin:0 -18px 15px"><a href="#perfil">‹</a><h2>Notificações</h2><span></span></div><div class="admin-card">${remoteNotifications.length?remoteNotifications.map(n=>`<div class="notice" data-notification="${n.id}"><strong>${esc(n.title)}</strong><small>${esc(n.message)}<br>${esc(n.created_at||'')}</small></div>`).join(''):'<div style="padding:20px;text-align:center;color:var(--muted);font-size:11px">Você não tem notificações novas.</div>'}</div></main>${bottom('notifications')}</section>`}
function renderProfile(){const me=state.apiUser||{name:'Amanda Silva',email:'',phone:''};const unread=remoteNotifications.filter(n=>!n.read).length;return `<section class="screen" id="perfil">${clientHeader('Conta e preferências')}<main class="content"><div class="page-header" style="margin:0 -18px 15px"><a href="#cliente-home">‹</a><h2>Meu perfil</h2><span></span></div><div class="profile-header"><div class="profile-avatar">${initials(me.name)}</div><div><h2>${esc(me.name)}</h2><p>${esc(me.email||'E-mail não informado')}<br>${esc(me.phone||'Telefone não informado')}</p></div></div><div class="admin-card"><div class="field"><label>Nome</label><input id="profile-name" value="${esc(me.name)}"></div><div class="field"><label>Telefone</label><input id="profile-phone" value="${esc(me.phone||'')}"></div><button class="btn" data-profile-save>Salvar alterações</button></div>${remoteLoyaltyClient.settings?.enabled?`<div class="maintenance-card"><span>♡</span><div><strong>Fidelidade</strong><small>${remoteLoyaltyClient.account?.points||0} pontos · ${remoteLoyaltyClient.account?.visits||0} atendimentos</small></div></div>`:''}<div class="settings-list" style="margin-top:14px"><a href="#notificacoes"><span>⌁</span><span>Notificações ${unread?`(${unread} novas)`:''}</span><b>›</b></a><a href="#agendamentos"><span>▣</span><span>Histórico de agendamentos</span><b>›</b></a><a href="#documentos"><span>✎</span><span>Documentos e autorizações</span><b>›</b></a><button type="button" data-delete-account style="color:var(--red)"><span>×</span><span>Excluir minha conta</span><b>›</b></button><button class="logout" data-logout><span>↪</span><span>Sair da conta</span><b>›</b></button></div></main>${bottom('profile')}</section>`}

function proNav(){let items=[['pro-dashboard','⌂','Início'],['pro-agenda','▣','Agenda'],['pro-services','✦','Serviços'],['pro-clients','♙','Clientes'],['pro-settings','⚙','Ajustes']];return `<nav class="pro-nav">${items.map(x=>`<button class="${state.proTab===x[0].replace('pro-','')?'active':''}" data-pro-route="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function proHead(title,copy){return `<div class="pro-head"><div><span class="eyebrow">ÁREA PROFISSIONAL</span><h2>${title}</h2><p>${copy}</p></div><div class="avatar">J</div></div>`}
function renderProDashboard(){return `<section class="screen" id="pro-dashboard"><main class="pro-content">${proHead('Bom dia, Jozyhely','Aqui está o resumo do seu salão hoje.')}<div class="stats"><div class="stat"><span>Agendamentos</span><strong>08</strong></div><div class="stat"><span>Clientes</span><strong>42</strong></div><div class="stat"><span>Retornos</span><strong>${remoteReturns.filter(r=>r.state==='today'||r.state==='soon').length||0}</strong></div></div><div class="section-title"><h2>Próximo atendimento</h2><a href="#pro-agenda">Ver agenda</a></div><div class="next-client"><div class="profile-avatar">A</div><div><small>13:00 · HOJE</small><strong>Amanda Silva</strong><span>Manicure e Pedicure · R$ 50,00</span></div><em>Confirmado</em></div><div class="section-title"><h2>Acesso rápido</h2></div><div class="pro-grid"><a href="#pro-agenda"><span>▣</span><strong>Agenda</strong></a><a href="#pro-services"><span>✦</span><strong>Serviços</strong></a><a href="#pro-clients"><span>♙</span><strong>Clientes</strong></a><a href="#pro-reports"><span>▤</span><strong>Relatórios</strong></a><a href="#pro-documents"><span>✎</span><strong>Documentos</strong></a><a href="#pro-portfolio"><span>▧</span><strong>Portfólio</strong></a><a href="#pro-inventory"><span>▤</span><strong>Estoque</strong></a><a href="#pro-purchases"><span>⌁</span><strong>Escanear compra</strong></a><a href="#pro-loyalty"><span>♡</span><strong>Fidelidade</strong></a><a href="#pro-finance"><span>◈</span><strong>Financeiro</strong></a><a href="#pro-settings"><span>⚙</span><strong>Configurações</strong></a></div></main>${proNav()}</section>`}
function renderProAgenda(){const base=new Date(`${proAgendaDate}T12:00:00`),start=new Date(base);if(proAgendaView==='week')start.setDate(base.getDate()-base.getDay());const end=new Date(start);end.setDate(start.getDate()+(proAgendaView==='week'?6:proAgendaView==='month'?30:0));const list=appointments.filter(a=>{const d=new Date(`${a.isoDate||'1900-01-01'}T12:00:00`);return d>=start&&d<=end});return `<section class="screen" id="pro-agenda"><main class="pro-content">${proHead('Agenda','Visualize seus atendimentos e horários.')}<div class="tabs"><button class="${proAgendaView==='day'?'active':''}" data-agenda-view="day">Dia</button><button class="${proAgendaView==='week'?'active':''}" data-agenda-view="week">Semana</button><button class="${proAgendaView==='month'?'active':''}" data-agenda-view="month">Mês</button></div><div class="admin-card"><div class="field"><label>Data selecionada</label><input id="pro-agenda-date" type="date" value="${proAgendaDate}"></div><div class="agenda-list">${list.map(a=>`<div class="agenda-item"><time>${esc(a.time)}</time><div class="agenda-client"><div class="profile-avatar">${initials(a.client)}</div><div><strong>${esc(a.client)}</strong><span>${esc(a.service)} · ${esc(a.price)}</span></div></div><div><em>${esc(a.status)}</em>${a.rawStatus!=='cancelled'&&a.rawStatus!=='completed'?`<button class="btn small" data-agenda-correct="${a.id}">Corrigir</button>`:''}</div></div>`).join('')||'<div class="notice"><small>Nenhum atendimento neste período.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProServices(){return `<section class="screen" id="pro-services"><main class="pro-content">${proHead('Serviços e preços','Atualize o catálogo que aparece para suas clientes.')}<div class="admin-card"><div class="admin-list">${services.map((s,i)=>`<div class="admin-row">${servicePhoto(s[0],s[3])}<div><strong>${esc(s[0])}</strong><small>${esc(s[1])} · retorno sugerido: ${s[4]||21} dias</small></div><b>${s[2]}</b>${state.demoMode?`<button class="btn small" data-demo-edit-service="${i}">Editar</button><button class="btn small" data-demo-delete-service="${i}">Excluir</button>`:remoteServiceIds[s[0]]?`<button class="btn small" data-edit-service="${remoteServiceIds[s[0]]}">Editar</button><button class="btn small" data-delete-service="${remoteServiceIds[s[0]]}">Excluir</button>`:''}</div>`).join('')}</div><button class="btn" style="margin-top:16px" data-add-service>Adicionar serviço</button></div></main>${proNav()}</section>`}
function renderProClients(){const now=new Date(),month=String(now.getMonth()+1).padStart(2,'0');const list=remoteClients.length?remoteClients.map(c=>[c.id,c.name,initials(c.name),`${c.appointments_count||0} atendimentos`,c.last_appointment||'sem atendimento',c.blocked,c.birth_date,c.created_at]):[];const newCount=list.filter(c=>String(c[7]||'').slice(0,7)===`${now.getFullYear()}-${month}`).length;const birthdayCount=list.filter(c=>String(c[6]||'').slice(5,7)===month).length;return `<section class="screen" id="pro-clients"><main class="pro-content">${proHead('Clientes','Histórico e relacionamento com sua base.')}<div class="stats"><div class="stat"><span>Total</span><strong>${list.length}</strong></div><div class="stat"><span>Novos no mês</span><strong>${newCount}</strong></div><div class="stat"><span>Aniversários</span><strong>${birthdayCount}</strong></div></div><div class="admin-card"><div class="inline"><input id="client-search" placeholder="Buscar nome, e-mail ou telefone"><button class="btn small" data-client-export>Exportar</button></div><form id="client-create-form" style="margin-top:12px"><div class="inline"><input name="name" placeholder="Nome da cliente" required><input name="email" type="email" placeholder="E-mail" required></div><div class="inline"><input name="phone" placeholder="Telefone"><input name="birth_date" type="date" title="Data de nascimento"></div><button class="btn small">Cadastrar cliente</button></form></div><div class="admin-card"><div class="admin-list">${list.map(c=>`<div class="admin-row"><div class="profile-avatar" style="width:45px;height:45px;font-size:18px">${c[2]}</div><div><strong>${esc(c[1])}</strong><small>${esc(c[3])} · último: ${esc(c[4])}${c[5]?' · BLOQUEADA':''}${c[6]?` · nasc. ${esc(c[6])}`:''}</small></div>${c[0]?`<button class="btn small" data-client-toggle="${c[0]}" data-blocked="${c[5]?'1':'0'}">${c[5]?'Liberar':'Bloquear'}</button>`:'<b>›</b>'}</div>`).join('')||'<div class="notice"><small>Nenhuma cliente encontrada.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProReports(){const r=remoteOperations||{};const bars=Object.entries(r.by_hour||{}).sort().map(([h,n])=>`<div class="notice"><strong>${esc(h)}</strong><small>${n} agendamento${n===1?'':'s'}</small></div>`).join('')||'<div class="notice"><small>Sem dados para os filtros atuais.</small></div>';return `<section class="screen" id="pro-reports"><main class="pro-content">${proHead('Relatórios','Entenda a operação do salão.')}<div class="admin-card"><form id="report-filter"><div class="inline"><div class="field"><label>De</label><input name="start" type="date"></div><div class="field"><label>Até</label><input name="end" type="date"></div></div><div class="inline"><div class="field"><label>Profissional</label><select name="professional_id"><option value="">Todas</option>${remoteProfessionalOptions.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Serviço</label><select name="service_id"><option value="">Todos</option>${services.map(s=>`<option value="${remoteServiceIds[s[0]]||''}">${esc(s[0])}</option>`).join('')}</select></div></div><div class="inline"><button class="btn small">Aplicar filtros</button><button type="button" class="btn outline small" data-report-print>Imprimir</button></div></form></div><div class="stats"><div class="stat"><span>Agendamentos</span><strong>${r.total||0}</strong></div><div class="stat"><span>Concluídos</span><strong>${r.completed||0}</strong></div><div class="stat"><span>Cancelados</span><strong>${r.cancelled||0}</strong></div><div class="stat"><span>Ausentes</span><strong>${r.absent||0}</strong></div></div><div class="stats"><div class="stat"><span>Ticket médio</span><strong>${moneyLabel(r.ticket_average_cents||0)}</strong></div><div class="stat"><span>Faturamento concluído</span><strong>${moneyLabel(r.completed_value_cents||0)}</strong></div></div><div class="section-title"><h2>Agendamentos por horário</h2></div><div class="admin-card"><div class="admin-list">${bars}</div></div><div class="section-title"><h2>Agendamentos por dia</h2></div><div class="admin-card"><div class="admin-list">${Object.entries(r.by_day||{}).map(([d,n])=>`<div class="notice"><strong>${esc(d.split('-').reverse().join('/'))}</strong><small>${n} atendimento${n===1?'':'s'}</small></div>`).join('')||'<div class="notice"><small>Sem agendamentos no período.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderPortfolio(){const portfolioItems=remotePortfolio.length?remotePortfolio:DEMO_PORTFOLIO;return `<section class="screen" id="portfolio"><main class="content"><div class="page-header"><a href="#public-preview">‹</a><h2>Meu Portfólio</h2><span></span></div><div class="portfolio-filter"><input id="portfolio-search" placeholder="Buscar modelo, técnica ou estilo"></div><div class="portfolio-grid">${portfolioItems.map(p=>`<article class="portfolio-card"><div class="portfolio-card-image" style="${p.photo_url?`background-image:url('${esc(p.photo_url)}')`:''}"><span>${p.photo_url?'':'✦'}</span></div><div class="portfolio-card-body"><strong>${esc(p.title)}</strong><small>${esc(p.technique)} · ${esc(p.shape)} · ${esc(p.length)}</small><small>${esc(p.nail_art||p.colors||'Nail Design')}</small><b>${moneyLabel(p.price_cents)} · ${p.duration_min} min</b><button class="btn small" data-portfolio-book="${p.id}">Quero esse modelo</button></div></article>`).join('')||'<div class="notice"><small>Nenhum trabalho publicado.</small></div>'}</div></main></section>`}
function renderDesignBuilder(){const shapes=['Quadrada','Almond','Coffin','Stiletto','Oval'],lengths=['Curto','Médio','Longo'],styles=['Francesinha','Cromada','Glitter','Encapsulada','Floral','Minimalista','Decorada'];return `<section class="screen" id="design-builder"><main class="content"><div class="page-header"><a href="#cliente-home">‹</a><h2>Monte sua unha</h2><span></span></div><div class="admin-card"><p>Combine formato, comprimento e estilo para receber uma sugestão de procedimento.</p><div class="field"><label>Formato</label><select id="builder-shape">${shapes.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Comprimento</label><select id="builder-length">${lengths.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Estilo</label><select id="builder-style">${styles.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn" data-design-quote>Calcular modelo</button><div id="design-result"></div></div></main>${bottom('book')}</section>`}
function renderProPortfolio(){return `<section class="screen" id="pro-portfolio"><main class="pro-content">${proHead('Portfólio','Mostre seus trabalhos e converta inspiração em agendamento.')}<div class="admin-card"><form id="portfolio-create-form"><div class="field"><label>Nome do modelo</label><input name="title" required placeholder="Ex.: Almond cromada"></div><div class="inline"><input name="technique" placeholder="Técnica"><input name="category" placeholder="Categoria"></div><div class="inline"><input name="shape" placeholder="Formato"><input name="length" placeholder="Comprimento"></div><div class="inline"><input name="colors" placeholder="Cores"><input name="nail_art" placeholder="Nail Art"></div><div class="inline"><input name="price" type="number" step="0.01" placeholder="Preço"><input name="duration" type="number" placeholder="Duração (min)"></div><input name="photo_url" placeholder="URL da foto" style="width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px"><button class="btn">Adicionar ao portfólio</button></form></div><div class="admin-card"><div class="admin-list">${remotePortfolio.map(p=>`<div class="admin-row"><div class="profile-avatar">✦</div><div><strong>${esc(p.title)}</strong><small>${esc(p.technique)} · ${moneyLabel(p.price_cents)}</small></div><button class="btn small" data-portfolio-delete="${p.id}">Excluir</button></div>`).join('')||'<div class="notice"><small>Nenhum trabalho publicado.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProLoyalty(){const s=remoteLoyalty||{};return `<section class="screen" id="pro-loyalty"><main class="pro-content">${proHead('Fidelidade','Crie um incentivo que combine com suas clientes.')}<div class="admin-card"><form id="loyalty-form"><label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:11px"><input type="checkbox" name="enabled" ${s.enabled?'checked':''}> Ativar programa de fidelidade</label><div class="field"><label>Formato</label><select name="mode"><option value="card" ${s.mode==='card'?'selected':''}>Cartão por atendimentos</option><option value="points" ${s.mode==='points'?'selected':''}>Pontos</option></select></div><div class="inline"><div class="field"><label>Atendimentos necessários</label><input name="visits_required" type="number" min="1" value="${s.visits_required||4}"></div><div class="field"><label>Pontos por R$ 1</label><input name="points_per_real" type="number" min="0" step="0.1" value="${s.points_per_real||1}"></div></div><div class="field"><label>Benefício</label><input name="reward" value="${esc(s.reward||'Nail Art grátis')}"></div><div class="field"><label>Validade em dias</label><input name="validity_days" type="number" min="1" value="${s.validity_days||180}"></div><button class="btn">Salvar regras</button></form></div></main>${proNav()}</section>`}
function renderProPurchases(){return `<section class="screen" id="pro-purchases"><main class="pro-content">${proHead('Escanear compra','Confirme a nota antes de atualizar estoque e financeiro.')}<div class="admin-card"><form id="purchase-scan-form"><div class="field"><label>Nota fiscal (PDF, texto ou imagem)</label><input name="file" type="file" accept=".pdf,.txt,.csv,image/*" required></div><button class="btn">Ler compra</button></form>${purchaseDraft?`<div class="notice"><strong>Produtos encontrados — confira antes de confirmar</strong><small>${purchaseDraft.items.length} item(ns) · origem: ${esc(purchaseDraft.source)}</small></div><form id="purchase-confirm-form"><div class="field"><label>Fornecedor</label><input name="supplier" required></div><div class="field"><label>Data</label><input name="date" type="date" value="2026-09-12" required></div>${purchaseDraft.items.map((x,i)=>`<div class="notice"><strong>${esc(x.description)}</strong><small>${x.quantity} ${esc(x.unit)} · ${moneyLabel(x.unit_cost_cents)} por unidade</small><input type="hidden" name="item_${i}" value="${esc(JSON.stringify(x))}"></div>`).join('')}<button class="btn">Confirmar compra</button></form>`:''}</div><div class="admin-card"><h3>Histórico de compras</h3><div class="admin-list">${remotePurchases.map(p=>`<div class="notice"><strong>${esc(p.supplier||'Compra de materiais')}</strong><small>${esc(p.date)} · ${moneyLabel(p.total_cents)}</small></div>`).join('')||'<div class="notice"><small>Nenhuma compra registrada.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProInventory(){return `<section class="screen" id="pro-inventory"><main class="pro-content">${proHead('Estoque','Acompanhe materiais e alertas de reposição.')}<div class="admin-card"><form id="inventory-form"><div class="inline"><input name="name" placeholder="Produto" required><input name="category" placeholder="Categoria"></div><div class="inline"><input name="quantity" type="number" step="0.1" placeholder="Quantidade"><input name="minimum_quantity" type="number" step="0.1" placeholder="Estoque mínimo"></div><div class="inline"><input name="unit" placeholder="Unidade" value="unidade"><input name="cost" type="number" step="0.01" placeholder="Custo"></div><button class="btn">Cadastrar material</button></form></div><div class="admin-card"><div class="admin-list">${remoteInventory.map(x=>`<div class="notice"><strong>${esc(x.name)} ${x.low_stock?'· ESTOQUE BAIXO':''}</strong><small>${x.quantity} ${esc(x.unit)} · ${moneyLabel(x.cost_cents)}</small></div>`).join('')||'<div class="notice"><small>Nenhum material cadastrado.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProDocuments(){return `<section class="screen" id="pro-documents"><main class="pro-content">${proHead('Documentos','Fichas e autorizações personalizadas.')}<div class="admin-card"><h3>Novo documento</h3><form id="document-create-form"><div class="field"><label>Cliente</label><select name="client_id" required>${remoteClients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Título</label><input name="title" required placeholder="Ex.: Ficha de anamnese"></div><div class="field"><label>Descrição</label><input name="description" placeholder="Para que serve este documento"></div><div class="field"><label>Perguntas, uma por linha</label><textarea name="fields" rows="4" placeholder="Possui alergias?\nAlguma observação?"></textarea></div><button class="btn">Enviar documento</button></form></div><div class="admin-card"><h3>Documentos enviados</h3><div class="admin-list">${remoteDocuments.map(d=>`<div class="notice"><strong>${esc(d.title)}</strong><small>${esc(d.client_name||'Cliente')} · ${d.status==='completed'?'Assinado':'Aguardando preenchimento'}</small></div>`).join('')||'<div class="notice"><small>Nenhum documento criado.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderClientDocuments(){return `<section class="screen" id="documentos"><main class="content"><div class="page-header"><a href="#perfil">‹</a><h2>Documentos</h2><span></span></div>${remoteDocuments.map(d=>`<div class="admin-card" style="margin:14px 0"><h3>${esc(d.title)}</h3><p>${esc(d.description||'Leia e responda antes de assinar.')}</p>${d.status==='completed'?`<div class="notice"><strong>Documento assinado</strong><small>Assinado por ${esc(d.signature_name||'cliente')}</small></div>`:`<form data-document-sign="${d.id}">${(d.fields||[]).map(f=>`<div class="field"><label>${esc(f.label||f.key)}</label><input name="${esc(f.key)}" ${f.required==='true'?'required':''}></div>`).join('')}<div class="field"><label>Assinatura</label><input name="signature_name" required placeholder="Digite seu nome completo"></div><button class="btn">Responder e assinar</button></form>`}</div>`).join('')||'<div class="notice"><small>Nenhum documento pendente.</small></div>'}</main>${bottom('profile')}</section>`}
function renderProFinance(){return `<section class="screen" id="pro-finance"><main class="pro-content">${proHead('Financeiro','Acompanhe receitas, despesas e saldo do salão.')}<div class="stats"><div class="stat"><span>Receitas</span><strong>R$ ${(remoteReport.income_cents/100).toFixed(2).replace('.',',')}</strong></div><div class="stat"><span>Despesas</span><strong>R$ ${(remoteReport.expense_cents/100).toFixed(2).replace('.',',')}</strong></div><div class="stat"><span>A receber</span><strong>R$ ${((remoteReport.pending_cents||0)/100).toFixed(2).replace('.',',')}</strong></div><div class="stat"><span>Saldo</span><strong>R$ ${(remoteReport.balance_cents/100).toFixed(2).replace('.',',')}</strong></div></div><div class="admin-card"><h3>Adicionar lançamento</h3><form id="finance-form"><div class="inline"><div class="field"><label>Tipo</label><select name="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></div><div class="field"><label>Valor</label><input name="amount" type="number" step="0.01" min="0" required></div></div><div class="field"><label>Descrição</label><input name="description" required placeholder="Ex.: Materiais"></div><div class="field"><label>Data</label><input name="date" type="date" required></div><button class="btn">Salvar lançamento</button></form></div><div class="section-title"><h2>Lançamentos recentes</h2></div><div class="admin-card"><div class="admin-list">${remoteFinance.slice(0,10).map(t=>`<div class="notice"><strong>${esc(t.description)}</strong><small>${t.type==='income'?'Receita':'Despesa'} · R$ ${(t.amount_cents/100).toFixed(2).replace('.',',')} · ${esc(t.date)}</small></div>`).join('')||'<div class="notice"><small>Nenhum lançamento registrado.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderProNotifications(){const due=remoteReturns.filter(r=>r.state==='today');const soon=remoteReturns.filter(r=>r.state==='soon');const history=remoteReturns.filter(r=>r.state==='history');return `<section class="screen" id="pro-notifications"><main class="pro-content">${proHead('Lembretes de retorno','Acompanhe os retornos que precisam da sua atenção.')}<div class="stats"><div class="stat"><span>Hoje</span><strong>${due.length}</strong></div><div class="stat"><span>Próximos 3 dias</span><strong>${soon.length}</strong></div><div class="stat"><span>Histórico</span><strong>${history.length}</strong></div></div><div class="section-title"><h2>Para hoje</h2></div><div class="admin-card"><div class="admin-list">${due.map(r=>`<div class="notice"><strong>${esc(r.client_name)}</strong><small>${esc(r.service_name)} · retorno previsto hoje</small></div>`).join('')||'<div class="notice"><small>Nenhum retorno previsto para hoje.</small></div>'}</div></div><div class="section-title"><h2>Próximos 3 dias</h2></div><div class="admin-card"><div class="admin-list">${soon.map(r=>`<div class="notice"><strong>${esc(r.client_name)}</strong><small>${esc(r.service_name)} · ${esc(r.next_reminder_date)}</small></div>`).join('')||'<div class="notice"><small>Nenhum retorno próximo.</small></div>'}</div></div><div class="section-title"><h2>Histórico de retornos</h2></div><div class="admin-card"><div class="admin-list">${history.map(r=>`<div class="notice"><strong>${esc(r.client_name)}</strong><small>${esc(r.service_name)} · atendimento concluído em ${esc(r.completed_date)} · retorno ${esc(r.next_reminder_date||'sem data')}</small></div>`).join('')||'<div class="notice"><small>Nenhum retorno registrado.</small></div>'}</div></div></main>${proNav()}</section>`}
function renderPublicPreview(){const place=[remoteBusiness.address,remoteBusiness.city,remoteBusiness.state,remoteBusiness.postal_code].filter(Boolean).join(' · ');const visibleServices=services.slice(0,3);return `<section class="screen" id="public-preview"><main class="public-shell"><header class="public-top"><a class="public-back" href="#pro-settings">‹</a><span class="public-mark">J</span><button class="public-share" type="button" data-public-share>⋯</button></header><section class="public-hero">${remoteBusiness.photo_url?`<img src="${esc(remoteBusiness.photo_url)}" class="public-photo" alt="${esc(remoteBusiness.name||'Studio')}">`:'<div class="public-photo public-photo-fallback">J</div>'}<span class="public-eyebrow">AGENDE SEU MOMENTO</span><h1>${esc(remoteBusiness.name||'Seu salão')}</h1><p>${esc(remoteBusiness.tagline||'Beleza que valoriza você')}</p><div class="public-socials">${remoteBusiness.instagram?`<span>Instagram · ${esc(remoteBusiness.instagram)}</span>`:''}${remoteBusiness.whatsapp?`<span>WhatsApp disponível</span>`:''}</div></section><div class="public-main"><div class="public-about"><span class="eyebrow">SOBRE O STUDIO</span><p>${esc(remoteBusiness.bio||'Um atendimento pensado para valorizar sua beleza, com cuidado, delicadeza e acabamento impecável.')}</p></div>${place?`<section class="public-info-card"><div class="public-info-icon">⌖</div><div><strong>Onde estamos</strong><p>${esc(place)}</p>${remoteBusiness.latitude&&remoteBusiness.longitude?`<button type="button" class="public-link" data-open-map>Abrir localização</button>`:''}</div></section>`:''}<section class="public-info-card"><div class="public-info-icon">◷</div><div><strong>Horários de atendimento</strong><p>Agende seu horário de forma rápida e segura.</p><a class="public-link" href="#horarios">Ver disponibilidade</a></div></section>${remotePortfolio.length?`<section class="public-services"><div class="public-section-head"><div><span class="eyebrow">INSPIRAÇÕES</span><h2>Meu portfólio</h2></div><a href="#portfolio">Ver todos</a></div><div class="public-portfolio-grid">${remotePortfolio.slice(0,4).map(p=>`<a class="public-portfolio-card" href="#portfolio"><div class="public-portfolio-image" style="${p.photo_url?`background-image:url('${esc(p.photo_url)}')`:''}"><span>${p.photo_url?'':'✦'}</span></div><strong>${esc(p.title)}</strong><small>${esc(p.technique||p.category||'Nail Design')}</small></a>`).join('')}</div></section>`:''}<section class="public-services"><div class="public-section-head"><div><span class="eyebrow">ESCOLHA SEU CUIDADO</span><h2>Serviços</h2></div><a href="#servicos">Ver todos</a></div><div class="public-service-list">${visibleServices.map(s=>`<div class="public-service"><div><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span></div><b>${esc(s[2])}</b></div>`).join('')}</div></section><a class="public-cta" href="#servicos">Agendar meu horário <span>→</span></a><p class="public-footer">${esc(remoteBusiness.name||'Studio Jozyhely')} · Atendimento com carinho</p></div></main></section>`}
function renderProSettings(){const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const hours=remoteHours.length?remoteHours:days.map((name,weekday)=>({weekday,active:weekday>0,open_time:'09:00',close_time:weekday===6?'13:00':'18:00',name}));return `<section class="screen" id="pro-settings"><main class="pro-content">${proHead('Configurações','Ajuste o funcionamento do seu salão.')}<div class="admin-card"><h3>Horários de atendimento</h3><p>Defina quando suas clientes podem agendar.</p>${hours.map(h=>`<div class="hours-row" data-hour-row="${h.weekday}"><strong>${days[h.weekday]}</strong><label class="time-field"><span>Início</span><input type="time" data-hour-open value="${h.open_time}" ${h.active?'':'disabled'}></label><label class="time-field"><span>Fim</span><input type="time" data-hour-close value="${h.close_time}" ${h.active?'':'disabled'}></label><button class="btn small" data-hour-save="${h.weekday}">Salvar</button></div>`).join('')}</div><div class="admin-card" style="margin-top:14px"><h3>Bloqueios da agenda</h3><p>Almoço, folgas e horários indisponíveis.</p><form id="block-form"><div class="inline"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>Motivo</label><input name="reason" placeholder="Almoço" required></div></div><div class="inline"><div class="field"><label>Início</label><input name="start_time" type="time" required></div><div class="field"><label>Fim</label><input name="end_time" type="time" required></div></div><button class="btn">Adicionar bloqueio</button></form><div class="admin-list" style="margin-top:12px">${remoteBlocks.map(b=>`<div class="notice"><strong>${esc(b.date)} · ${esc(b.start_time)}–${esc(b.end_time)}</strong><small>${esc(b.reason)}</small><button class="btn small" data-delete-block="${b.id}">Remover</button></div>`).join('')||'<div class="notice"><small>Nenhum bloqueio cadastrado.</small></div>'}</div></div><div class="admin-card" style="margin-top:14px"><h3>Página pública de agendamento</h3><p>Configure o perfil que suas clientes verão no link do salão.</p><form id="business-profile-form"><div class="inline"><div class="field"><label>Nome</label><input name="name" value="${esc(remoteBusiness.name||'')}"></div><div class="field"><label>URL</label><input name="slug" value="${esc(remoteBusiness.slug||'')}" pattern="[a-z0-9-]{3,60}"></div></div><div class="field"><label>Descrição curta</label><input name="tagline" value="${esc(remoteBusiness.tagline||'')}"></div><div class="field"><label>Foto (URL)</label><input name="photo_url" value="${esc(remoteBusiness.photo_url||'')}" placeholder="https://..."></div><div class="field"><label>Endereço</label><input name="address" value="${esc(remoteBusiness.address||'')}"></div><div class="inline"><input name="city" placeholder="Cidade" value="${esc(remoteBusiness.city||'')}"><input name="state" placeholder="UF" value="${esc(remoteBusiness.state||'')}"><input name="postal_code" placeholder="CEP" value="${esc(remoteBusiness.postal_code||'')}"></div><div class="inline"><input name="latitude" type="number" step="any" placeholder="Latitude" value="${remoteBusiness.latitude||''}"><input name="longitude" type="number" step="any" placeholder="Longitude" value="${remoteBusiness.longitude||''}"></div><div class="inline"><input name="instagram" placeholder="Instagram" value="${esc(remoteBusiness.instagram||'')}"><input name="whatsapp" placeholder="WhatsApp" value="${esc(remoteBusiness.whatsapp||'')}"></div><label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:11px"><input type="checkbox" name="active" ${remoteBusiness.active?'checked':''}> Página ativa</label><button class="btn">Salvar página pública</button></form><div class="notice" style="margin-top:10px"><small>Link: /agendar/${esc(remoteBusiness.slug||'studiojozynails')}</small><a href="#public-preview" style="display:block;color:var(--gold2);font-size:10px;margin-top:5px">Visualizar página pública →</a></div></div><div class="settings-list" style="margin-top:14px"><a href="#pro-notifications"><span>♧</span><span>Lembretes de retorno</span><b>›</b></a><button class="logout" data-logout><span>↪</span><span>Sair da área profissional</span><b>›</b></button></div></main>${proNav()}</section>`}
function render(){const routes={inicio:renderInicio,'cliente-login':renderLogin,'cliente-register':renderRegister,'cliente-forgot':renderForgot,'cliente-home':renderHome,notificacoes:renderNotifications,servicos:renderServices,profissionais:renderProfessionals,horarios:renderSchedule,pagamento:renderPayment,confirmacao:renderConfirmation,agendamentos:renderAppointments,perfil:renderProfile,'public-preview':renderPublicPreview,portfolio:renderPortfolio,'design-builder':renderDesignBuilder,documentos:renderClientDocuments,'profissional-login':renderProLogin,'pro-dashboard':renderProDashboard,'pro-agenda':renderProAgenda,'pro-services':renderProServices,'pro-clients':renderProClients,'pro-reports':renderProReports,'pro-documents':renderProDocuments,'pro-portfolio':renderProPortfolio,'pro-inventory':renderProInventory,'pro-purchases':renderProPurchases,'pro-loyalty':renderProLoyalty,'pro-finance':renderProFinance,'pro-notifications':renderProNotifications,'pro-settings':renderProSettings};const fn=routes[state.route]||renderInicio;let html=fn();if(!html.includes('class="screen active"'))html=html.replace('class="screen"','class="screen active"');document.querySelector('#app').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.route;location.hash=state.route;render()}));document.querySelectorAll('[data-demo-login]').forEach(el=>el.addEventListener('click',()=>useDemoData(el.dataset.demoLogin==='professional'?'professional':'client')));document.querySelectorAll('[data-api-demo]').forEach(el=>el.addEventListener('click',async()=>{const professional=el.dataset.apiDemo==='professional';try{const data=await window.BeautyAPI.login(professional?'admin@jozyhely.com':'amanda@demo.com',professional?'jozy123':'123456');state.apiUser=data.user;await syncApiData()}catch(error){console.warn('API offline; seguindo em modo visual',error)}state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}));document.querySelectorAll('[data-api-login]').forEach(el=>el.addEventListener('click',async()=>{const professional=el.dataset.apiLogin==='professional';const identity=document.querySelector(professional?'#pro-identity':'#client-identity')?.value.trim();const password=document.querySelector(professional?'#pro-password':'#client-password')?.value||'';if(!identity||!password){alert('Informe seus dados de acesso.');return}el.disabled=true;try{const data=await window.BeautyAPI.login(identity,password);state.apiUser=data.user;await syncApiData();state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}catch(error){if(error.offline){state.apiUser={role:professional?'professional':'client',offline:true};state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}else alert(error.message)}finally{el.disabled=false}}));document.querySelector('[data-register-submit]')?.addEventListener('click',async()=>{const name=document.querySelector('#register-name')?.value.trim();const email=document.querySelector('#register-email')?.value.trim();const phone=document.querySelector('#register-phone')?.value.trim();const password=document.querySelector('#register-password')?.value||'';if(!name||!email||password.length<6){alert('Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.');return}try{await window.BeautyAPI.register({name,email,phone,password});const data=await window.BeautyAPI.login(email,password);state.apiUser=data.user;await syncApiData();state.route='cliente-home';location.hash=state.route;render()}catch(error){alert(error.message)}});document.querySelector('[data-reset-request]')?.addEventListener('click',async()=>{const email=document.querySelector('#reset-email')?.value.trim();if(!email){alert('Informe seu e-mail.');return}try{const result=await window.BeautyAPI.requestPasswordReset(email);alert(result.message)}catch(error){alert(error.message)}});document.querySelectorAll('[data-agenda-correct]').forEach(el=>el.addEventListener('click',async()=>{const status=prompt('Status: completed, cancelled ou absent','completed');if(!status||!['completed','cancelled','absent'].includes(status))return;const reason=prompt('Motivo da correção','Ajuste excepcional');if(!reason)return;const photo=prompt('URL da foto do resultado (opcional)','');try{await window.BeautyAPI.correctAppointment(el.dataset.agendaCorrect,{status,reason,result_photo_url:photo||null});await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-agenda-view]').forEach(el=>el.addEventListener('click',()=>{proAgendaView=el.dataset.agendaView;render()}));document.querySelector('#pro-agenda-date')?.addEventListener('change',e=>{proAgendaDate=e.target.value;render()});document.querySelectorAll('[data-pro-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.proRoute;state.proTab=el.dataset.proRoute.replace('pro-','');location.hash=state.route;render()}));document.querySelectorAll('[data-demo-edit-service]').forEach(el=>el.addEventListener('click',()=>demoEditService(Number(el.dataset.demoEditService))) ayment=input.value}));document.querySelector('[data-confirm-booking]')?.addEventListener('click',confirmBooking);document.querySelector('#service-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.service-row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});document.querySelector('#client-search')?.addEventListener('input',async e=>{try{remoteClients=await window.BeautyAPI.clients(e.target.value.trim());render()}catch(error){console.warn(error)}});document.querySelector('[data-client-export]')?.addEventListener('click',async()=>{try{const csv=await window.BeautyAPI.exportClients();const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clientes.csv';a.click();URL.revokeObjectURL(url)}catch(error){alert(error.message)}});document.querySelector('#portfolio-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.portfolio-card').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});document.querySelectorAll('[data-portfolio-book]').forEach(el=>el.addEventListener('click',()=>{const item=remotePortfolio.find(x=>String(x.id)===String(el.dataset.portfolioBook));if(item){state.client.service=services.find(s=>`${s[0]} ${s[1]}`.toLowerCase().includes(String(item.technique||'').toLowerCase()))?.[0]||services[0]?.[0];state.client.portfolioId=item.id;state.route='servicos';location.hash='servicos';render()}}));document.querySelector('#portfolio-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{await window.BeautyAPI.createPortfolio({title:d.get('title'),technique:d.get('technique'),category:d.get('category'),shape:d.get('shape'),length:d.get('length'),colors:d.get('colors'),nail_art:d.get('nail_art'),price_cents:Math.round(Number(d.get('price')||0)*100),duration_min:Number(d.get('duration')||60),photo_url:d.get('photo_url'),active:true});await syncApiData();render()}catch(error){alert(error.message)}});document.querySelectorAll('[data-portfolio-delete]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir este trabalho?'))return;try{await window.BeautyAPI.deletePortfolio(el.dataset.portfolioDelete);await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelector('#purchase-scan-form')?.addEventListener('submit',async e=>{e.preventDefault();const file=e.target.querySelector('[name=file]').files[0];if(!file)return;try{purchaseDraft=await window.BeautyAPI.scanPurchase(file);render()}catch(error){alert(error.message)}});document.querySelector('#purchase-confirm-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target),items=[];for(const [key,value] of d.entries())if(key.startsWith('item_'))items.push(JSON.parse(value));try{await window.BeautyAPI.confirmPurchase({supplier:d.get('supplier'),date:d.get('date'),items});purchaseDraft=null;await syncApiData();render()}catch(error){alert(error.message)}});document.querySelector('#loyalty-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{remoteLoyalty=await window.BeautyAPI.updateLoyaltySettings({enabled:d.get('enabled')==='on',mode:d.get('mode'),visits_required:Number(d.get('visits_required')),points_per_real:Number(d.get('points_per_real')),reward:d.get('reward'),validity_days:Number(d.get('validity_days'))});alert('Programa de fidelidade atualizado.');render()}catch(error){alert(error.message)}});document.querySelector('#inventory-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{await window.BeautyAPI.createInventory({name:d.get('name'),category:d.get('category'),quantity:Number(d.get('quantity')||0),minimum_quantity:Number(d.get('minimum_quantity')||0),unit:d.get('unit'),cost_cents:Math.round(Number(d.get('cost')||0)*100),active:true});await syncApiData();render()}catch(error){alert(error.message)}});document.querySelector('[data-design-quote]')?.addEventListener('click',async()=>{try{const q=await window.BeautyAPI.designQuote({shape:document.querySelector('#builder-shape').value,length:document.querySelector('#builder-length').value,style:document.querySelector('#builder-style').value});document.querySelector('#design-result').innerHTML=`<div class="notice"><strong>${esc(q.service_name)}</strong><small>${esc(q.shape)} · ${esc(q.length)} · ${esc(q.style)} · ${moneyLabel(q.price_cents)} · ${q.duration_min} min</small><a class="btn small" href="#servicos" style="margin-top:8px;display:inline-grid;place-items:center">Agendar este modelo</a></div>`}catch(error){alert(error.message)}});document.querySelector('#document-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);const fields=String(data.get('fields')||'').split('\n').map(x=>x.trim()).filter(Boolean).map((label,i)=>({key:`field_${i+1}`,label,type:'text',required:'false'}));try{await window.BeautyAPI.createDocument({client_id:Number(data.get('client_id')),title:data.get('title'),description:data.get('description'),fields});await syncApiData();render()}catch(error){alert(error.message)}});document.querySelectorAll('[data-document-sign]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(form),answers={};for(const [key,value] of data.entries())if(key!=='signature_name')answers[key]=value;try{await window.BeautyAPI.respondDocument(form.dataset.documentSign,{answers,signature_name:data.get('signature_name')});await syncApiData();render();alert('Documento assinado com sucesso.')}catch(error){alert(error.message)}}));document.querySelector('#client-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{const result=await window.BeautyAPI.createClient({name:data.get('name'),email:data.get('email'),phone:data.get('phone'),birth_date:data.get('birth_date')||null});alert(`Cliente cadastrada. Senha temporária: ${result.temporary_password}`);await syncApiData();render()}catch(error){alert(error.message)}});document.querySelector('#finance-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{await window.BeautyAPI.addTransaction({type:data.get('type'),description:data.get('description'),amount_cents:Math.round(Number(String(data.get('amount')).replace(',','.'))*100),date:data.get('date')});await syncApiData();render()}catch(error){alert(error.message)}});document.querySelector('#report-filter')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{remoteOperations=await window.BeautyAPI.operationalReport({start:data.get('start'),end:data.get('end'),professional_id:data.get('professional_id'),service_id:data.get('service_id')});render()}catch(error){alert(error.message)}});document.querySelector('[data-report-print]')?.addEventListener('click',()=>window.print());document.querySelector('[data-open-map]')?.addEventListener('click',()=>{if(remoteBusiness.latitude&&remoteBusiness.longitude)window.open(`https://www.google.com/maps/search/?api=1&query=${remoteBusiness.latitude},${remoteBusiness.longitude}`,'_blank')});document.querySelector('[data-public-share]')?.addEventListener('click',async()=>{const data={title:remoteBusiness.name||'Studio Jozyhely',text:remoteBusiness.tagline||'Agende seu horário'};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);alert('Link da página copiado.')}catch(error){console.warn(error)}});document.querySelector('#business-profile-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{remoteBusiness=await window.BeautyAPI.updateBusinessProfile({name:data.get('name'),slug:data.get('slug'),tagline:data.get('tagline'),photo_url:data.get('photo_url'),address:data.get('address'),city:data.get('city'),state:data.get('state'),postal_code:data.get('postal_code'),latitude:data.get('latitude')?Number(data.get('latitude')):null,longitude:data.get('longitude')?Number(data.get('longitude')):null,instagram:data.get('instagram'),whatsapp:data.get('whatsapp'),active:data.get('active')==='on'});alert('Página pública atualizada.');render()}catch(error){alert(error.message)}});document.querySelector('[data-whatsapp-save]')?.addEventListener('click',async()=>{const enabled=document.querySelector('#whatsapp-enabled')?.checked||false;const phone=document.querySelector('#whatsapp-phone')?.value.trim()||'';try{whatsappPreferences=await window.BeautyAPI.updateWhatsappPreferences({enabled,phone});alert(enabled?'Avisos no WhatsApp ativados.':'Avisos no WhatsApp desativados.')}catch(error){alert(error.message)}});document.querySelector('[data-profile-save]')?.addEventListener('click',async()=>{const name=document.querySelector('#profile-name')?.value.trim();const phone=document.querySelector('#profile-phone')?.value.trim()||'';try{const result=await window.BeautyAPI.updateProfile({name,phone});state.apiUser=result.user;await syncApiData();render();alert('Perfil atualizado.')}catch(error){alert(error.message)}});document.querySelectorAll('[data-hour-save]').forEach(el=>el.addEventListener('click',async()=>{const row=el.closest('[data-hour-row]');const open=row.querySelector('[data-hour-open]').value;const close=row.querySelector('[data-hour-close]').value;try{await window.BeautyAPI.updateHours(Number(el.dataset.hourSave),{active:true,open_time:open,close_time:close});await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelector('#block-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{await window.BeautyAPI.createBlock({date:data.get('date'),start_time:data.get('start_time'),end_time:data.get('end_time'),reason:data.get('reason')});await syncApiData();render()}catch(error){alert(error.message)}});document.querySelectorAll('[data-delete-block]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.deleteBlock(el.dataset.deleteBlock);await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-whatsapp-send]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Enviar esta mensagem pelo WhatsApp?'))return;try{await window.BeautyAPI.sendWhatsappMessage(el.dataset.whatsappSend);await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-whatsapp-cancel]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.cancelWhatsappMessage(el.dataset.whatsappCancel);await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-notification]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.markNotificationRead(el.dataset.notification);el.style.opacity='.55'}catch(error){console.warn(error)}}));document.querySelectorAll('[data-reschedule]').forEach(el=>el.addEventListener('click',()=>rescheduleAppointment(el.dataset.reschedule)));document.querySelectorAll('[data-cancel]').forEach(el=>el.addEventListener('click',()=>cancelAppointment(el.dataset.cancel)));document.querySelector('[data-delete-account]')?.addEventListener('click',async()=>{if(!confirm('Deseja excluir sua conta? Seus dados pessoais serão anonimizados.'))return;try{await window.BeautyAPI.deleteAccount();state.apiUser=null;state.route='inicio';location.hash='inicio';render()}catch(error){alert(error.message)}});document.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click',async()=>{try{if(window.BeautyAPI?.isConnected())await window.BeautyAPI.logout()}finally{state.apiUser=null;state.demoMode=false;state.route='inicio';location.hash='inicio';render()}}));document.querySelectorAll('[data-client-toggle]').forEach(el=>el.addEventListener('click',async()=>{const blocked=el.dataset.blocked!=='1';try{await window.BeautyAPI.updateClientProfile(el.dataset.clientToggle,{blocked});await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-edit-service]').forEach(el=>el.addEventListener('click',async()=>{const row=el.closest('.admin-row');const service=remoteServiceDetails[el.dataset.editService]||{};const currentName=service.name||row.querySelector('strong')?.textContent||'Serviço';const returnDays=prompt('Intervalo de retorno em dias',String(service.return_days||21));if(!returnDays)return;try{await window.BeautyAPI.updateService(el.dataset.editService,{name:currentName,description:service.description||'',price_cents:service.price_cents||0,duration_min:service.duration_min||30,return_days:Number(returnDays),active:true});await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-delete-service]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir este serviço?'))return;try{await window.BeautyAPI.deleteService(el.dataset.deleteService);await syncApiData();render()}catch(error){alert(error.message)}}));document.querySelector('[data-add-service]')?.addEventListener('click',async()=>{if(state.demoMode)return demoAddService();const name=prompt('Nome do serviço');if(!name)return;const price=prompt('Preço em reais','50');const duration=prompt('Duração em minutos','60');const returnDays=prompt('Avisar a profissional após quantos dias para refazer?','21');try{await window.BeautyAPI.createService({name,description:'Novo serviço cadastrado',price_cents:Math.round(Number(String(price).replace(',','.'))*100),duration_min:Number(duration),return_days:Number(returnDays)||21,active:true});await syncApiData();render()}catch(error){alert(error.message)}})}
window.addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'inicio';render()});state.route=location.hash.slice(1)||'inicio';render();
</script>
