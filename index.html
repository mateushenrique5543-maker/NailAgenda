    <div class="admin-card" style="margin-top:16px"><h3>Bloqueios da agenda</h3><p>Almoço, folgas e horários indisponíveis.</p><form id="block-form"><div class="inline"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>Motivo</label><input name="reason" placeholder="Almoço" required></div></div><div class="inline"><div class="field"><label>Início</label><input name="start_time" type="time" required></div><div class="field"><label>Fim</label><input name="end_time" type="time" required></div></div><button class="btn">Adicionar bloqueio</button></form><div class="admin-list" style="margin-top:14px">${remoteBlocks.map(b=>`<div class="notice"><strong>${esc(b.date)} · ${esc(b.start_time)}–${esc(b.end_time)}</strong><small>${esc(b.reason)}</small><button class="btn small" data-delete-block="${b.id}" style="margin-top:8px">Remover</button></div>`).join('')||'<div class="notice"><small>Nenhum bloqueio cadastrado.</small></div>'}</div></div>
    <div class="admin-card" style="margin-top:16px"><h3>Página pública de agendamento</h3><p>Configure o perfil que suas clientes verão no link do salão.</p>
      <form id="business-profile-form">
        <div class="inline">
          <div class="field"><label>Nome</label><input name="name" value="${esc(remoteBusiness.name||'')}"></div>
          <div class="field"><label>URL</label><input name="slug" value="${esc(remoteBusiness.slug||'')}" pattern="[a-z0-9-]{3,60}"></div>
        </div>
        <div class="field"><label>Descrição curta</label><input name="tagline" value="${esc(remoteBusiness.tagline||'')}"></div>
        <div class="field"><label>Foto (URL)</label><input name="photo_url" value="${esc(remoteBusiness.photo_url||'')}" placeholder="https://..."></div>
        <div class="field"><label>Endereço</label><input name="address" value="${esc(remoteBusiness.address||'')}"></div>
        <div class="inline cols-3" style="margin-bottom:10px">
          <input name="city" placeholder="Cidade" value="${esc(remoteBusiness.city||'')}">
          <input name="state" placeholder="UF" value="${esc(remoteBusiness.state||'')}">
          <input name="postal_code" placeholder="CEP" value="${esc(remoteBusiness.postal_code||'')}">
        </div>
        <div class="inline" style="margin-bottom:10px">
          <input name="latitude" type="number" step="any" placeholder="Latitude" value="${remoteBusiness.latitude||''}">
          <input name="longitude" type="number" step="any" placeholder="Longitude" value="${remoteBusiness.longitude||''}">
        </div>
        <div class="inline" style="margin-bottom:10px">
          <input name="instagram" placeholder="Instagram" value="${esc(remoteBusiness.instagram||'')}">
          <input name="whatsapp" placeholder="WhatsApp" value="${esc(remoteBusiness.whatsapp||'')}">
        </div>
        <label style="display:flex;gap:9px;align-items:center;margin:12px 0;font-size:11.5px"><input type="checkbox" name="active" ${remoteBusiness.active?'checked':''}> Página ativa</label>
        <button class="btn">Salvar página pública</button>
      </form>
      <div class="notice" style="margin-top:12px"><small>Link: /agendar/${esc(remoteBusiness.slug||'studiojozynails')}</small><a href="#public-preview" style="display:block;color:var(--gold-deep);font-size:10.5px;margin-top:6px;font-weight:600">Visualizar página pública →</a></div>
    </div>
    <div class="settings-list" style="margin-top:16px"><a href="#pro-notifications">${icon('bell',18)}<span>Lembretes de retorno</span><b>${icon('chevronR',16)}</b></a><button class="logout" data-logout>${icon('logout',18)}<span>Sair da área profissional</span><b>${icon('chevronR',16)}</b></button></div>
  </main>${proNav()}</section>`;
}

/* ========== RENDER MASTER ========== */
function render(){
  const routes={
    inicio:renderInicio,
    'cliente-login':renderLogin,
    'cliente-register':renderRegister,
    'cliente-forgot':renderForgot,
    'cliente-home':renderHome,
    notificacoes:renderNotifications,
    servicos:renderServices,
    profissionais:renderProfessionals,
    horarios:renderSchedule,
    pagamento:renderPayment,
    confirmacao:renderConfirmation,
    agendamentos:renderAppointments,
    perfil:renderProfile,
    'public-preview':renderPublicPreview,
    portfolio:renderPortfolio,
    'design-builder':renderDesignBuilder,
    documentos:renderClientDocuments,
    'profissional-login':renderProLogin,
    'pro-dashboard':renderProDashboard,
    'pro-agenda':renderProAgenda,
    'pro-services':renderProServices,
    'pro-clients':renderProClients,
    'pro-reports':renderProReports,
    'pro-documents':renderProDocuments,
    'pro-portfolio':renderProPortfolio,
    'pro-inventory':renderProInventory,
    'pro-purchases':renderProPurchases,
    'pro-loyalty':renderProLoyalty,
    'pro-finance':renderProFinance,
    'pro-notifications':renderProNotifications,
    'pro-settings':renderProSettings
  };
  const fn=routes[state.route]||renderInicio;
  let html=fn();
  if(!html.includes('class="screen active"'))html=html.replace('class="screen"','class="screen active"');
  document.querySelector('#app').innerHTML=html;
  bind();
}

/* ========== BIND (eventos) ========== */
function bind(){
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.route;location.hash=state.route;render()}));
  document.querySelectorAll('[data-demo-login]').forEach(el=>el.addEventListener('click',()=>useDemoData(el.dataset.demoLogin==='professional'?'professional':'client')));
  document.querySelectorAll('[data-api-demo]').forEach(el=>el.addEventListener('click',async()=>{const professional=el.dataset.apiDemo==='professional';try{const data=await window.BeautyAPI.login(professional?'admin@jozyhely.com':'amanda@demo.com',professional?'jozy123':'123456');state.apiUser=data.user;await syncApiData()}catch(error){console.warn('API offline; seguindo em modo visual',error)}state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}));
  document.querySelectorAll('[data-api-login]').forEach(el=>el.addEventListener('click',async()=>{const professional=el.dataset.apiLogin==='professional';const identity=document.querySelector(professional?'#pro-identity':'#client-identity')?.value.trim();const password=document.querySelector(professional?'#pro-password':'#client-password')?.value||'';if(!identity||!password){alert('Informe seus dados de acesso.');return}el.disabled=true;try{const data=await window.BeautyAPI.login(identity,password);state.apiUser=data.user;await syncApiData();state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}catch(error){if(error.offline){state.apiUser={role:professional?'professional':'client',offline:true};state.route=professional?'pro-dashboard':'cliente-home';location.hash=state.route;render()}else alert(error.message)}finally{el.disabled=false}}));
  document.querySelector('[data-register-submit]')?.addEventListener('click',async()=>{const name=document.querySelector('#register-name')?.value.trim();const email=document.querySelector('#register-email')?.value.trim();const phone=document.querySelector('#register-phone')?.value.trim();const password=document.querySelector('#register-password')?.value||'';if(!name||!email||password.length<6){alert('Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.');return}try{await window.BeautyAPI.register({name,email,phone,password});const data=await window.BeautyAPI.login(email,password);state.apiUser=data.user;await syncApiData();state.route='cliente-home';location.hash=state.route;render()}catch(error){alert(error.message)}});
  document.querySelector('[data-reset-request]')?.addEventListener('click',async()=>{const email=document.querySelector('#reset-email')?.value.trim();if(!email){alert('Informe seu e-mail.');return}try{const result=await window.BeautyAPI.requestPasswordReset(email);alert(result.message)}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-agenda-correct]').forEach(el=>el.addEventListener('click',async()=>{const status=prompt('Status: completed, cancelled ou absent','completed');if(!status||!['completed','cancelled','absent'].includes(status))return;const reason=prompt('Motivo da correção','Ajuste excepcional');if(!reason)return;const photo=prompt('URL da foto do resultado (opcional)','');try{await window.BeautyAPI.correctAppointment(el.dataset.agendaCorrect,{status,reason,result_photo_url:photo||null});await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-agenda-view]').forEach(el=>el.addEventListener('click',()=>{proAgendaView=el.dataset.agendaView;render()}));
  document.querySelector('#pro-agenda-date')?.addEventListener('change',e=>{proAgendaDate=e.target.value;render()});
  document.querySelectorAll('[data-pro-route]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();state.route=el.dataset.proRoute;state.proTab=el.dataset.proRoute.replace('pro-','');location.hash=state.route;render()}));
  document.querySelectorAll('[data-demo-edit-service]').forEach(el=>el.addEventListener('click',()=>demoEditService(Number(el.dataset.demoEditService))));
  document.querySelectorAll('[data-demo-delete-service]').forEach(el=>el.addEventListener('click',()=>demoDeleteService(Number(el.dataset.demoDeleteService))));
  document.querySelectorAll('[data-service]').forEach(el=>el.addEventListener('click',()=>{state.client.service=el.dataset.service;remoteSlots=null}));
  document.querySelectorAll('[data-pro]').forEach(el=>el.addEventListener('click',()=>{state.client.professional=el.dataset.pro;remoteSlots=null;loadAvailability()}));
  document.querySelectorAll('[data-time]').forEach(el=>el.addEventListener('click',()=>{state.client.time=el.dataset.time;render()}));
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('[data-day]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.client.date=el.dataset.date;remoteSlots=null;loadAvailability()}));
  document.querySelector('[data-month-prev]')?.addEventListener('click',()=>{shiftMonth(-1);render();loadAvailability()});
  document.querySelector('[data-month-next]')?.addEventListener('click',()=>{shiftMonth(1);render();loadAvailability()});
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render()}));
  document.querySelectorAll('.category').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));el.classList.add('active')}));
  document.querySelectorAll('[data-extra-service]').forEach(el=>el.addEventListener('change',()=>{const name=el.dataset.extraService;if(el.checked&&!state.client.extras.includes(name))state.client.extras.push(name);if(!el.checked)state.client.extras=state.client.extras.filter(x=>x!==name)}));
  document.querySelectorAll('.payment-option').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const input=el.querySelector('input');input.checked=true;state.client.payment=input.value}));
  document.querySelector('[data-confirm-booking]')?.addEventListener('click',confirmBooking);
  document.querySelector('#service-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.service-row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});
  document.querySelector('#client-search')?.addEventListener('input',async e=>{try{remoteClients=await window.BeautyAPI.clients(e.target.value.trim());render()}catch(error){console.warn(error)}});
  document.querySelector('[data-client-export]')?.addEventListener('click',async()=>{try{const csv=await window.BeautyAPI.exportClients();const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clientes.csv';a.click();URL.revokeObjectURL(url)}catch(error){alert(error.message)}});
  document.querySelector('#portfolio-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.portfolio-card').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});
  document.querySelectorAll('[data-portfolio-book]').forEach(el=>el.addEventListener('click',()=>{const item=remotePortfolio.find(x=>String(x.id)===String(el.dataset.portfolioBook));if(item){state.client.service=services.find(s=>`${s[0]} ${s[1]}`.toLowerCase().includes(String(item.technique||'').toLowerCase()))?.[0]||services[0]?.[0];state.client.portfolioId=item.id;state.route='servicos';location.hash='servicos';render()}}));
  document.querySelector('#portfolio-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{await window.BeautyAPI.createPortfolio({title:d.get('title'),technique:d.get('technique'),category:d.get('category'),shape:d.get('shape'),length:d.get('length'),colors:d.get('colors'),nail_art:d.get('nail_art'),price_cents:Math.round(Number(d.get('price')||0)*100),duration_min:Number(d.get('duration')||60),photo_url:d.get('photo_url'),active:true});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-portfolio-delete]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir este trabalho?'))return;try{await window.BeautyAPI.deletePortfolio(el.dataset.portfolioDelete);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelector('#purchase-scan-form')?.addEventListener('submit',async e=>{e.preventDefault();const file=e.target.querySelector('[name=file]').files[0];if(!file)return;try{purchaseDraft=await window.BeautyAPI.scanPurchase(file);render()}catch(error){alert(error.message)}});
  document.querySelector('#purchase-confirm-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target),items=[];for(const [key,value] of d.entries())if(key.startsWith('item_'))items.push(JSON.parse(value));try{await window.BeautyAPI.confirmPurchase({supplier:d.get('supplier'),date:d.get('date'),items});purchaseDraft=null;await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('#loyalty-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{remoteLoyalty=await window.BeautyAPI.updateLoyaltySettings({enabled:d.get('enabled')==='on',mode:d.get('mode'),visits_required:Number(d.get('visits_required')),points_per_real:Number(d.get('points_per_real')),reward:d.get('reward'),validity_days:Number(d.get('validity_days'))});alert('Programa de fidelidade atualizado.');render()}catch(error){alert(error.message)}});
  document.querySelector('#inventory-form')?.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(e.target);try{await window.BeautyAPI.createInventory({name:d.get('name'),category:d.get('category'),quantity:Number(d.get('quantity')||0),minimum_quantity:Number(d.get('minimum_quantity')||0),unit:d.get('unit'),cost_cents:Math.round(Number(d.get('cost')||0)*100),active:true});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('[data-design-quote]')?.addEventListener('click',async()=>{try{const q=await window.BeautyAPI.designQuote({shape:document.querySelector('#builder-shape').value,length:document.querySelector('#builder-length').value,style:document.querySelector('#builder-style').value});document.querySelector('#design-result').innerHTML=`<div class="notice" style="margin-top:14px"><strong>${esc(q.service_name)}</strong><small>${esc(q.shape)} · ${esc(q.length)} · ${esc(q.style)} · ${moneyLabel(q.price_cents)} · ${q.duration_min} min</small><a class="btn small" href="#servicos" style="margin-top:10px;display:inline-grid;place-items:center">Agendar este modelo</a></div>`}catch(error){alert(error.message)}});
  document.querySelector('#document-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);const fields=String(data.get('fields')||'').split('\n').map(x=>x.trim()).filter(Boolean).map((label,i)=>({key:`field_${i+1}`,label,type:'text',required:'false'}));try{await window.BeautyAPI.createDocument({client_id:Number(data.get('client_id')),title:data.get('title'),description:data.get('description'),fields});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-document-sign]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(form),answers={};for(const [key,value] of data.entries())if(key!=='signature_name')answers[key]=value;try{await window.BeautyAPI.respondDocument(form.dataset.documentSign,{answers,signature_name:data.get('signature_name')});await syncApiData();render();alert('Documento assinado com sucesso.')}catch(error){alert(error.message)}}));
  document.querySelector('#client-create-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{const result=await window.BeautyAPI.createClient({name:data.get('name'),email:data.get('email'),phone:data.get('phone'),birth_date:data.get('birth_date')||null});alert(`Cliente cadastrada. Senha temporária: ${result.temporary_password}`);await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('#finance-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{await window.BeautyAPI.addTransaction({type:data.get('type'),description:data.get('description'),amount_cents:Math.round(Number(String(data.get('amount')).replace(',','.'))*100),date:data.get('date')});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelector('#report-filter')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{remoteOperations=await window.BeautyAPI.operationalReport({start:data.get('start'),end:data.get('end'),professional_id:data.get('professional_id'),service_id:data.get('service_id')});render()}catch(error){alert(error.message)}});
  document.querySelector('[data-report-print]')?.addEventListener('click',()=>window.print());
  document.querySelector('[data-open-map]')?.addEventListener('click',()=>{if(remoteBusiness.latitude&&remoteBusiness.longitude)window.open(`https://www.google.com/maps/search/?api=1&query=${remoteBusiness.latitude},${remoteBusiness.longitude}`,'_blank')});
  document.querySelector('[data-public-share]')?.addEventListener('click',async()=>{const data={title:remoteBusiness.name||'Studio Jozyhely',text:remoteBusiness.tagline||'Agende seu horário'};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);alert('Link da página copiado.')}catch(error){console.warn(error)}});
  document.querySelector('#business-profile-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{remoteBusiness=await window.BeautyAPI.updateBusinessProfile({name:data.get('name'),slug:data.get('slug'),tagline:data.get('tagline'),photo_url:data.get('photo_url'),address:data.get('address'),city:data.get('city'),state:data.get('state'),postal_code:data.get('postal_code'),latitude:data.get('latitude')?Number(data.get('latitude')):null,longitude:data.get('longitude')?Number(data.get('longitude')):null,instagram:data.get('instagram'),whatsapp:data.get('whatsapp'),active:data.get('active')==='on'});alert('Página pública atualizada.');render()}catch(error){alert(error.message)}});
  document.querySelector('[data-whatsapp-save]')?.addEventListener('click',async()=>{const enabled=document.querySelector('#whatsapp-enabled')?.checked||false;const phone=document.querySelector('#whatsapp-phone')?.value.trim()||'';try{whatsappPreferences=await window.BeautyAPI.updateWhatsappPreferences({enabled,phone});alert(enabled?'Avisos no WhatsApp ativados.':'Avisos no WhatsApp desativados.')}catch(error){alert(error.message)}});
  document.querySelector('[data-profile-save]')?.addEventListener('click',async()=>{const name=document.querySelector('#profile-name')?.value.trim();const phone=document.querySelector('#profile-phone')?.value.trim()||'';try{const result=await window.BeautyAPI.updateProfile({name,phone});state.apiUser=result.user;await syncApiData();render();alert('Perfil atualizado.')}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-hour-save]').forEach(el=>el.addEventListener('click',async()=>{const row=el.closest('[data-hour-row]');const open=row.querySelector('[data-hour-open]').value;const close=row.querySelector('[data-hour-close]').value;try{await window.BeautyAPI.updateHours(Number(el.dataset.hourSave),{active:true,open_time:open,close_time:close});await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelector('#block-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);try{await window.BeautyAPI.createBlock({date:data.get('date'),start_time:data.get('start_time'),end_time:data.get('end_time'),reason:data.get('reason')});await syncApiData();render()}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-delete-block]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.deleteBlock(el.dataset.deleteBlock);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-whatsapp-send]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Enviar esta mensagem pelo WhatsApp?'))return;try{await window.BeautyAPI.sendWhatsappMessage(el.dataset.whatsappSend);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-whatsapp-cancel]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.cancelWhatsappMessage(el.dataset.whatsappCancel);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-notification]').forEach(el=>el.addEventListener('click',async()=>{try{await window.BeautyAPI.markNotificationRead(el.dataset.notification);el.style.opacity='.55'}catch(error){console.warn(error)}}));
  document.querySelectorAll('[data-reschedule]').forEach(el=>el.addEventListener('click',()=>rescheduleAppointment(el.dataset.reschedule)));
  document.querySelectorAll('[data-cancel]').forEach(el=>el.addEventListener('click',()=>cancelAppointment(el.dataset.cancel)));
  document.querySelector('[data-delete-account]')?.addEventListener('click',async()=>{if(!confirm('Deseja excluir sua conta? Seus dados pessoais serão anonimizados.'))return;try{await window.BeautyAPI.deleteAccount();state.apiUser=null;state.route='inicio';location.hash='inicio';render()}catch(error){alert(error.message)}});
  document.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click',async()=>{try{if(window.BeautyAPI?.isConnected())await window.BeautyAPI.logout()}finally{state.apiUser=null;state.demoMode=false;state.route='inicio';location.hash='inicio';render()}}));
  document.querySelectorAll('[data-client-toggle]').forEach(el=>el.addEventListener('click',async()=>{const blocked=el.dataset.blocked!=='1';try{await window.BeautyAPI.updateClientProfile(el.dataset.clientToggle,{blocked});await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-edit-service]').forEach(el=>el.addEventListener('click',async()=>{const row=el.closest('.admin-row');const service=remoteServiceDetails[el.dataset.editService]||{};const currentName=service.name||row.querySelector('strong')?.textContent||'Serviço';const returnDays=prompt('Intervalo de retorno em dias',String(service.return_days||21));if(!returnDays)return;try{await window.BeautyAPI.updateService(el.dataset.editService,{name:currentName,description:service.description||'',price_cents:service.price_cents||0,duration_min:service.duration_min||30,return_days:Number(returnDays),active:true});await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelectorAll('[data-delete-service]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir este serviço?'))return;try{await window.BeautyAPI.deleteService(el.dataset.deleteService);await syncApiData();render()}catch(error){alert(error.message)}}));
  document.querySelector('[data-add-service]')?.addEventListener('click',async()=>{if(state.demoMode)return demoAddService();const name=prompt('Nome do serviço');if(!name)return;const price=prompt('Preço em reais','50');const duration=prompt('Duração em minutos','60');const returnDays=prompt('Avisar a profissional após quantos dias para refazer?','21');try{await window.BeautyAPI.createService({name,description:'Novo serviço cadastrado',price_cents:Math.round(Number(String(price).replace(',','.'))*100),duration_min:Number(duration),return_days:Number(returnDays)||21,active:true});await syncApiData();render()}catch(error){alert(error.message)}});
}

window.addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'inicio';render()});
state.route=location.hash.slice(1)||'inicio';
render();
</script>
</body>
</html>
