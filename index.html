<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a67a45">
<title>Jozyhely Rodrigues — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#f6f0e9;
  --bg-2:#efe5da;
  --surface:#fffdfa;
  --surface-2:#fbf6ef;
  --ink:#231a14;
  --ink-2:#3d2f26;
  --text:#3a2c23;
  --muted:#8d7d6f;
  --muted-2:#a89a8c;
  --gold:#c39a6a;
  --gold-deep:#a67a45;
  --gold-dark:#7a5630;
  --gold-light:#e6d4ba;
  --gold-glow:rgba(196,154,106,.22);
  --border:#ece1d4;
  --border-strong:#e0d0bd;
  --green:#4f8a5c;
  --green-bg:#e3f0e5;
  --red:#c15b5b;
  --red-bg:#fae0e0;
  --shadow-xs:0 1px 2px rgba(60,40,25,.05);
  --shadow-sm:0 1px 2px rgba(60,40,25,.04),0 4px 12px rgba(60,40,25,.05);
  --shadow-md:0 4px 12px rgba(60,40,25,.06),0 12px 28px rgba(60,40,25,.06);
  --shadow-lg:0 12px 32px rgba(60,40,25,.10),0 30px 60px rgba(60,40,25,.07);
  --radius-sm:12px;
  --radius:16px;
  --radius-md:20px;
  --radius-lg:26px;
  --radius-pill:999px;
  --ease:cubic-bezier(.22,.7,.25,1);
  --font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-serif:"Playfair Display",Georgia,serif;
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  font-family:var(--font-sans);
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 12% -10%,rgba(196,154,106,.18),transparent 55%),
    radial-gradient(900px 500px at 100% 0%,rgba(214,180,142,.16),transparent 50%),
    #d9cab8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:-.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#fff}

/* ============ ÍCONES SVG ============ */
.ico{display:inline-grid;place-items:center;flex-shrink:0;line-height:0;color:currentColor}
.ico svg{width:100%;height:100%;display:block}

/* ============ APP SHELL ============ */
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(60,40,25,.04)}
.screen{display:none;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:screenIn .32s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ TIPOGRAFIA ============ */
h1,h2,h3{font-family:var(--font-serif);color:var(--ink);font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.12}
h2{font-size:21px;line-height:1.2}
h3{font-size:16px}
.eyebrow{display:block;color:var(--gold-deep);font-size:9.5px;letter-spacing:2.4px;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.content{padding:10px 18px 34px}

/* ============ TOP HEADER ============ */
.top-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 20px 14px;
  background:linear-gradient(180deg,rgba(255,253,250,.98),rgba(246,240,233,.72));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:5;
}
.header-left{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-size:18px;font-weight:600;box-shadow:0 6px 14px rgba(120,80,40,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.header-title strong{display:block;font-size:15px;letter-spacing:-.2px;color:var(--ink)}
.header-title span{display:block;color:var(--muted);font-size:9.5px;margin-top:3px;letter-spacing:.3px}
.header-action{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--gold-deep);display:grid;place-items:center;box-shadow:var(--shadow-xs);transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease)}
.header-action:hover{background:var(--surface-2);border-color:var(--border-strong)}
.header-action:active{transform:scale(.92)}
.header-action .ico{color:var(--gold-deep)}

/* ============ PAGE HEADER ============ */
.page-header{
  height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding:0 14px;margin:0 -18px 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,253,250,.96),rgba(246,240,233,.6));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:6;
}
.page-header>a{color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;transition:background .22s var(--ease),transform .22s var(--ease)}
.page-header>a:hover{background:var(--surface-2)}
.page-header>a:active{transform:translateX(-2px)}
.page-header h2{text-align:center;font-size:18px;letter-spacing:-.2px;font-weight:600}

/* ============ SECTION TITLE ============ */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.section-title h2{font-size:20px}
.section-title a{color:var(--gold-deep);font-size:10.5px;font-weight:600;letter-spacing:.2px}

/* ============ BOTÕES ============ */
.btn{
  width:100%;min-height:50px;border:0;border-radius:var(--radius);
  background:linear-gradient(180deg,#2f241d,#1e1611);
  color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;
  box-shadow:0 1px 2px rgba(0,0,0,.15),0 10px 24px rgba(30,20,12,.18);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s var(--ease);
  display:grid;place-items:center;padding:0 20px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.15),0 14px 28px rgba(30,20,12,.22)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.outline{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.outline:hover{background:var(--surface-2);border-color:var(--gold-light)}
.btn.danger{background:linear-gradient(180deg,#d06a6a,#b85050);box-shadow:0 8px 18px rgba(180,70,70,.25)}
.btn.small{width:auto;padding:0 14px;min-height:34px;font-size:9.5px;border-radius:10px;box-shadow:none;letter-spacing:.4px;text-transform:none}
.btn.small:hover{transform:none;box-shadow:none;filter:brightness(1.05)}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:calc(30px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom));
  background:
    radial-gradient(700px 500px at 85% 5%,rgba(196,154,106,.35),transparent 55%),
    radial-gradient(600px 400px at 10% 100%,rgba(196,154,106,.22),transparent 55%),
    linear-gradient(165deg,#2e221a 0%,#1a120c 60%,#0f0a07 100%);
  color:#fff;position:relative;overflow:hidden;
}
.login-screen::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px;opacity:.5;pointer-events:none}
.login-box{width:100%;text-align:center;position:relative;z-index:1}
.brand-symbol{
  width:88px;height:88px;margin:0 auto 18px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 60%),linear-gradient(145deg,#d8b78e,#a67a45);
  color:#fff;font-family:var(--font-serif);font-size:38px;font-weight:600;
  box-shadow:0 20px 45px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.15);
}
.brand-name{font-family:var(--font-serif);font-size:29px;color:#f0dcc0;letter-spacing:-.5px;font-weight:600}
.brand-subtitle{font-size:8.5px;letter-spacing:4.5px;color:#c5b0a0;margin-top:7px;text-transform:uppercase;font-weight:600}
.login-photo{height:150px;margin:26px 0;border-radius:24px;background:linear-gradient(180deg,rgba(30,20,14,.1),rgba(30,20,14,.5)),url('assets/nail-nude.png') center/cover;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.login-box .btn{background:linear-gradient(180deg,#f5e3c8,#d8b78e);color:#231a14;box-shadow:0 10px 26px rgba(0,0,0,.28);margin-bottom:10px}
.login-box .btn:hover{filter:brightness(1.03)}
.login-box .btn.outline{background:transparent;color:#f0dcc0;border:1px solid rgba(240,220,192,.35);box-shadow:none}
.login-box .btn.outline:hover{background:rgba(240,220,192,.08)}
.welcome-text{color:#a8988a;font-size:10px;margin-top:18px;letter-spacing:.3px}
.demo-entry{margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1)}
.demo-entry small{display:block;font-size:8.5px;letter-spacing:2.4px;color:#a8988a;font-weight:600;margin-bottom:12px}
.demo-btn{background:rgba(255,255,255,.06) !important;color:#e6d4ba !important;border:1px solid rgba(230,212,186,.2) !important;box-shadow:none !important;font-size:10.5px !important;min-height:44px !important}
.demo-btn:hover{background:rgba(230,212,186,.1) !important}

/* ============ HOME ============ */
.welcome{margin-top:18px;padding:0 2px}
.welcome h1{font-size:30px;line-height:1.12;letter-spacing:-.02em}
.welcome p{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}

/* ============ QUICK ACTIONS ============ */
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.quick-card{min-height:94px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow-xs);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.quick-card:hover{transform:translateY(-3px);border-color:var(--gold-light);box-shadow:var(--shadow-sm)}
.quick-card:active{transform:translateY(-1px) scale(.98)}
.quick-card .ico{color:var(--gold-deep);transition:transform .28s var(--ease);margin-bottom:9px}
.quick-card:hover .ico{transform:scale(1.08)}
.quick-card strong{font-size:9.5px;font-weight:600;letter-spacing:.2px;color:var(--ink)}

/* ============ PROMO ============ */
.promo{
  min-height:160px;padding:24px;border-radius:var(--radius-lg);
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(100deg,rgba(35,25,18,.88) 0%,rgba(35,25,18,.35) 60%,rgba(35,25,18,.15) 100%),url('assets/nail-rose.png') center/cover;
  box-shadow:var(--shadow-md);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.promo:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.promo small{font-size:8.5px;letter-spacing:2.4px;font-weight:600;opacity:.85;text-transform:uppercase}
.promo h2{color:#fff;font-size:25px;margin:10px 0;line-height:1.1;letter-spacing:-.02em}
.promo p{font-size:10px;max-width:190px;line-height:1.55;opacity:.9}

/* ============ CATEGORY BAR ============ */
.category-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:16px;scrollbar-width:none}
.category-bar::-webkit-scrollbar{display:none}
.category{flex-shrink:0;border:1px solid var(--border-strong);background:var(--surface);padding:9px 16px;border-radius:var(--radius-pill);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.2px;transition:all .25s var(--ease)}
.category:hover{border-color:var(--gold-light);color:var(--ink)}
.category.active{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(30,20,12,.18)}

/* ============ SERVICE LIST ============ */
.service-list,.professional-list,.appointment-list,.agenda-list{display:flex;flex-direction:column;gap:10px}
.service-row{
  display:grid;grid-template-columns:58px 1fr 22px;align-items:center;gap:13px;
  padding:11px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease);
}
.service-row:hover{transform:translateY(-2px);border-color:var(--gold-light);box-shadow:var(--shadow-sm)}
.service-row:active{transform:translateY(0) scale(.99)}
.service-photo{width:58px;height:58px;border-radius:14px;background:linear-gradient(145deg,#e8d3b6,#c39a6a);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-family:var(--font-serif);font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .3s var(--ease)}
.service-row:hover .service-photo{transform:scale(1.04)}
.service-info strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.service-info span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.service-info b{display:block;color:var(--gold-deep);font-size:11px;margin-top:6px;font-weight:700;letter-spacing:-.1px}
.service-arrow{color:var(--gold);display:grid;place-items:center}

/* ============ PROFISSIONAIS ============ */
.professional{display:flex;align-items:center;gap:13px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.professional:hover{transform:translateY(-2px);border-color:var(--gold-light);box-shadow:var(--shadow-sm)}
.professional:active{transform:scale(.99)}
.professional-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);display:grid;place-items:center;color:#fff;font-family:var(--font-serif);font-size:22px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s var(--ease)}
.professional:hover .professional-avatar{transform:scale(1.05)}
.professional-info{flex:1}
.professional-info strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.professional-info span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.rating{color:var(--gold-deep);font-size:9.5px;font-weight:600;display:block;margin-top:5px}

/* ============ CALENDÁRIO ============ */
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm)}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calendar-header strong{font-family:var(--font-serif);font-size:14px;font-weight:600;text-transform:capitalize;letter-spacing:-.1px}
.calendar-header button{border:1px solid var(--border);background:var(--surface-2);width:32px;height:32px;border-radius:50%;color:var(--gold-deep);display:grid;place-items:center;transition:all .22s var(--ease)}
.calendar-header button:hover{background:var(--gold-light);border-color:var(--gold)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week{margin-bottom:10px}
.week span{color:var(--muted-2);font-size:8px;font-weight:700;letter-spacing:.5px}
.days{gap:4px}
.days span{width:32px;height:32px;margin:auto;display:grid;place-items:center;border-radius:50%;font-size:10px;font-weight:500;cursor:pointer;transition:all .22s var(--ease)}
.days span:hover{background:var(--surface-2);color:var(--gold-deep)}
.days span.selected{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(30,20,12,.22)}
.days span.empty-day{cursor:default}
.days span.empty-day:hover{background:transparent}

/* ============ HORÁRIOS ============ */
.time-title{margin:22px 0 12px;font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--ink)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.time-grid button{padding:12px 8px;border:1px solid var(--border-strong);border-radius:13px;background:var(--surface);color:var(--text);font-size:10.5px;font-weight:500;transition:all .22s var(--ease)}
.time-grid button:hover{border-color:var(--gold);color:var(--gold-deep)}
.time-grid button.selected{background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(30,20,12,.2)}

/* ============ PAGAMENTO ============ */
.payment-summary,.confirmation-card,.appointment-card,.detail-card,.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.payment-summary{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:20px}
.payment-summary .service-photo{width:58px;height:58px}
.payment-summary strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.payment-summary span{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.payment-summary b{display:block;color:var(--gold-deep);font-size:12px;margin-top:6px;font-weight:700}
.payment-options{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.payment-option{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease),background .25s var(--ease)}
.payment-option:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--gold-light)}
.payment-option:active{transform:scale(.99)}
.payment-option.selected{border-color:var(--gold);background:linear-gradient(180deg,#fdf8f1,#f9f1e6);box-shadow:0 8px 20px rgba(196,154,106,.16)}
.payment-option input{accent-color:var(--gold-deep);margin-left:auto;width:18px;height:18px}
.payment-option-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#f6ecdd,#ecdcc5);display:grid;place-items:center;color:var(--gold-dark);font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.payment-option strong{display:block;font-size:11px;font-weight:600;color:var(--ink)}
.payment-option span{display:block;color:var(--muted);font-size:9px;margin-top:3px}

/* ============ CONFIRMAÇÃO ============ */
.confirmation{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(30px + env(safe-area-inset-top)) 24px calc(110px + env(safe-area-inset-bottom))}
.success-icon{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 60%),linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;display:grid;place-items:center;margin-bottom:22px;box-shadow:0 16px 38px rgba(120,80,40,.28),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .5s var(--ease)}
.success-icon .ico{color:#fff}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.confirmation h1{font-size:32px;margin-bottom:12px;line-height:1.1}
.confirmation>p{max-width:295px;color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:22px}
.confirmation-card{width:100%;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:14px;text-align:left;margin-bottom:20px}
.confirmation-card .service-photo{width:58px;height:58px}
.confirmation-card strong,.confirmation-card span{display:block}
.confirmation-card strong{font-size:12px;font-weight:600;color:var(--ink)}
.confirmation-card span{color:var(--muted);font-size:9px;margin-top:4px;line-height:1.4}
.confirmation-card>b{color:var(--gold-deep);font-size:11px;font-weight:700}

/* ============ TABS ============ */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#ebe0d2;border-radius:var(--radius-pill);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px;border-radius:var(--radius-pill);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.2px;transition:all .25s var(--ease)}
.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(70,50,30,.1)}

/* ============ AGENDAMENTOS ============ */
.appointment-card{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:12px;transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.appointment-card:hover{transform:translateY(-2px);border-color:var(--gold-light);box-shadow:var(--shadow-md)}
.appointment-card .service-photo{width:58px;height:58px}
.appointment-info strong,.appointment-info span,.appointment-info small{display:block}
.appointment-info strong{font-size:12.5px;font-weight:600;color:var(--ink)}
.appointment-info span{color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.4}
.appointment-info small{color:var(--gold-deep);font-size:10px;margin-top:6px;font-weight:700}
.status{font-size:8px;color:var(--green);background:var(--green-bg);padding:5px 9px;border-radius:var(--radius-pill);white-space:nowrap;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* ============ PERFIL ============ */
.profile-header{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-sm)}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#e8d3b6,#c39a6a);color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-size:24px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.profile-header h2{font-size:19px;letter-spacing:-.2px}
.profile-header p{color:var(--muted);font-size:10.5px;margin-top:4px;line-height:1.45}

/* ============ SETTINGS LIST ============ */
.settings-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.settings-list a,.settings-list button{
  min-height:56px;width:100%;display:grid;grid-template-columns:26px 1fr 22px;
  align-items:center;padding:0 16px;gap:4px;border-bottom:1px solid var(--border);
  background:var(--surface);text-align:left;font-size:12px;color:var(--text);font-weight:500;
  transition:background .22s var(--ease),padding-left .22s var(--ease);
}
.settings-list a:hover,.settings-list button:hover{background:var(--surface-2);padding-left:20px}
.settings-list a:last-child,.settings-list button:last-child{border-bottom:0}
.settings-list a>span:first-child,.settings-list button>span:first-child{color:var(--gold-deep);display:grid;place-items:center}
.settings-list b{grid-column:3;text-align:right;color:var(--muted-2);font-size:16px;font-weight:400;line-height:1;display:grid;place-items:center}
.settings-list .logout{color:var(--red)}
.settings-list .logout>span:first-child{color:var(--red)}

/* ============ PRO LOGIN ============ */
.pro-login{min-height:100vh;color:#fff;background:radial-gradient(700px 500px at 15% 10%,rgba(196,154,106,.32),transparent 55%),linear-gradient(155deg,#33261e 0%,#1c130d 60%,#0e0906 100%);display:flex;align-items:center}
.pro-auth{width:100%;padding:38px}
.pro-auth h1{color:#f0dcc0;font-size:42px;margin:18px 0 14px;line-height:1.05;letter-spacing:-.02em}
.pro-auth p{color:#b8a596;font-size:12px;max-width:290px;margin-bottom:28px;line-height:1.6}
.pro-auth input{width:100%;height:52px;padding:0 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;outline:0;transition:border-color .25s var(--ease),background .25s var(--ease)}
.pro-auth input:focus{border-color:var(--gold);background:rgba(255,255,255,.09)}
.pro-auth input::placeholder{color:#9c8a7c}
.pro-auth .btn{margin-top:10px;background:linear-gradient(180deg,#f5e3c8,#d8b78e);color:#231a14;box-shadow:0 12px 28px rgba(0,0,0,.28)}

/* ============ BOTTOM NAV ============ */
.pro-nav,.client-nav{
  position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:430px;min-height:74px;display:grid;
  background:rgba(255,253,250,.94);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--border);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 32px rgba(60,40,25,.06);
}
.pro-nav{grid-template-columns:repeat(5,1fr)}
.client-nav{grid-template-columns:repeat(5,1fr)}
.pro-nav button,.client-nav button{
  border:0;background:none;color:var(--muted-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-radius:14px;padding:6px 2px;
  transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease);
}
.pro-nav button .ico,.client-nav button .ico{color:var(--muted-2);transition:color .25s var(--ease)}
.pro-nav button small,.client-nav button small{font-size:9px;font-weight:600;letter-spacing:.15px}
.pro-nav button:hover,.client-nav button:hover{color:var(--gold-deep)}
.pro-nav button:hover .ico,.client-nav button:hover .ico{color:var(--gold-deep)}
.pro-nav button.active,.client-nav button.active{color:var(--ink);background:linear-gradient(180deg,#fbf2e5,#f4e6d1)}
.pro-nav button.active .ico,.client-nav button.active .ico{color:var(--gold-dark)}
.pro-nav button:active,.client-nav button:active{transform:scale(.94)}

/* ============ PRO CONTENT ============ */
.pro-content{padding:22px 18px calc(112px + env(safe-area-inset-bottom))}
.pro-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:14px}
.pro-head h2{font-size:26px;letter-spacing:-.02em;margin-top:4px}
.pro-head p{color:var(--muted);font-size:10.5px;margin-top:6px;line-height:1.5}

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.stat{padding:14px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.stat span{display:block;color:var(--muted);font-size:8.5px;margin-bottom:8px;font-weight:500;letter-spacing:.2px}
.stat strong{font-family:var(--font-serif);font-size:20px;color:var(--ink);font-weight:600;letter-spacing:-.02em}

/* ============ PRO GRID ============ */
.pro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pro-grid a{
  min-height:100px;padding:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease);
}
.pro-grid a:hover{transform:translateY(-3px);border-color:var(--gold-light);box-shadow:var(--shadow-sm)}
.pro-grid a:active{transform:translateY(-1px) scale(.98)}
.pro-grid .ico{color:var(--gold-deep);margin-bottom:9px;transition:transform .28s var(--ease)}
.pro-grid a:hover .ico{transform:scale(1.1)}
.pro-grid strong{font-size:10.5px;font-weight:600;color:var(--ink)}

/* ============ NEXT CLIENT ============ */
.next-client{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:10px;box-shadow:var(--shadow-sm)}
.next-client .profile-avatar{width:46px;height:46px;font-size:18px}
.next-client small,.next-client strong,.next-client span{display:block}
.next-client small{color:var(--gold-deep);font-size:9px;font-weight:700;letter-spacing:.4px}
.next-client strong{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:4px}
.next-client span{color:var(--muted);font-size:9.5px;margin-top:3px}
.next-client em{font-style:normal;color:var(--green);background:var(--green-bg);padding:5px 9px;border-radius:var(--radius-pill);font-size:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* ============ AGENDA ============ */
.agenda-item{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:15px 4px;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border-bottom:0}
.agenda-item time{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:-.1px}
.agenda-client{display:flex;align-items:center;gap:11px}
.agenda-client .profile-avatar{width:42px;height:42px;font-size:16px}
.agenda-client strong,.agenda-client span{display:block}
.agenda-client strong{font-size:11.5px;font-weight:600;color:var(--ink)}
.agenda-client span{color:var(--muted);font-size:9px;margin-top:3px}
.agenda-item em{font-style:normal;color:var(--green);background:var(--green-bg);padding:5px 9px;border-radius:var(--radius-pill);font-size:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;display:inline-block}

/* ============ ADMIN CARD ============ */
.admin-card{padding:18px}
.admin-card h3{font-size:18px;margin-bottom:6px;letter-spacing:-.2px}
.admin-card>p{color:var(--muted);font-size:10.5px;margin-bottom:16px;line-height:1.5}
.admin-list{display:flex;flex-direction:column;gap:9px}

/* ============ HORÁRIOS (Configurações) ============ */
.hours-row{display:grid;grid-template-columns:62px 1fr 38px;gap:10px;align-items:end;padding:14px 0;border-bottom:1px solid var(--border)}
.hours-row:last-child{border-bottom:0}
.hours-row>strong{font-size:10.5px;font-weight:600;color:var(--ink);padding-bottom:10px;letter-spacing:-.1px}
.hours-times{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.hours-times label{display:block;min-width:0}
.hours-times label span{display:block;font-size:7.5px;font-weight:700;color:var(--muted-2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.hours-times input{width:100%;min-width:0;height:38px;border:1px solid var(--border-strong);border-radius:10px;padding:0 8px;font-size:11px;font-weight:500;background:var(--surface);color:var(--ink);transition:border-color .22s var(--ease),box-shadow .22s var(--ease);-webkit-appearance:none;appearance:none}
.hours-times input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.hours-times input:disabled{opacity:.4}
.hours-save{width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(30,20,12,.18);transition:transform .2s var(--ease)}
.hours-save:active{transform:scale(.92)}
.hours-save .ico{color:#e6d4ba}

/* ============ ADMIN ROW ============ */
.admin-row{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:11px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.admin-row:hover{border-color:var(--gold-light);box-shadow:var(--shadow-xs)}
.admin-row .service-photo{width:48px;height:48px;font-size:18px;border-radius:12px}
.admin-row strong,.admin-row small{display:block}
.admin-row strong{font-size:11.5px;font-weight:600;color:var(--ink)}
.admin-row small{color:var(--muted);font-size:9px;margin-top:4px;line-height:1.4}
.admin-row b{color:var(--gold-deep);font-size:10px;font-weight:700}
.admin-row .btn.small{min-height:30px;padding:0 10px;font-size:8.5px;border-radius:9px}

/* ============ FORM FIELDS ============ */
.field{display:grid;gap:7px;margin-bottom:14px;min-width:0}
.field label{font-size:10.5px;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;min-width:0;height:48px;padding:0 14px;border:1px solid var(--border-strong);border-radius:13px;background:var(--surface);outline:0;color:var(--text);font-size:12px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.field textarea{height:auto;padding:12px 14px;resize:vertical;font-family:inherit;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted-2)}

/* Inline grid — inputs NUNCA estouram */
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.inline>*{min-width:0;width:100%}
.inline>input,.inline>select{
  height:48px;padding:0 14px;border:1px solid var(--border-strong);
  border-radius:13px;background:var(--surface);color:var(--text);
  font-size:12px;outline:0;min-width:0;width:100%;
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
}
.inline>input:focus,.inline>select:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow)}
.inline>input::placeholder{color:var(--muted-2)}
.inline.cols-3{grid-template-columns:1.5fr .55fr 1fr}

/* ============ NOTICE ============ */
.notice{padding:13px 0;border-bottom:1px solid var(--border);font-size:11.5px;line-height:1.5;color:var(--ink)}
.notice:last-child{border-bottom:0}
.notice strong{font-weight:600;color:var(--ink)}
.notice small{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.5}

/* ============ PÁGINA PÚBLICA ============ */
.public-shell{min-height:100vh;background:linear-gradient(180deg,#f6eee5 0%,#fbf6ef 40%,#fffaf6 100%)}
.public-top{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:linear-gradient(180deg,#f6eee5,rgba(246,238,229,0))}
.public-back,.public-share{width:38px;height:38px;border:1px solid rgba(167,122,75,.22);border-radius:50%;background:rgba(255,255,255,.7);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-xs);transition:transform .25s var(--ease),background .25s var(--ease)}
.public-back:hover,.public-share:hover{background:#fff;transform:scale(1.05)}
.public-back .ico,.public-share .ico{color:var(--ink)}
.public-share{justify-self:end}
.public-mark{width:40px;height:40px;margin:auto;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;font-family:var(--font-serif);font-size:18px;font-weight:600;box-shadow:0 8px 18px rgba(120,80,40,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.public-hero{text-align:center;padding:26px 24px 34px;background:linear-gradient(180deg,#f6eee5,rgba(240,225,207,.6))}
.public-photo{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;object-fit:cover;border:5px solid rgba(255,255,255,.85);box-shadow:0 16px 36px rgba(120,80,40,.2)}
.public-photo-fallback{display:grid;place-items:center;background:linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;font:44px var(--font-serif);font-weight:600}
.public-eyebrow{display:block;color:var(--gold-dark);font-size:8.5px;letter-spacing:3px;font-weight:700}
.public-hero h1{font-size:32px;margin:9px 0 6px;letter-spacing:-.02em}
.public-hero>p{color:#7c6047;font-size:11.5px;line-height:1.5}
.public-socials{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.public-socials span{padding:7px 12px;border:1px solid rgba(156,113,73,.22);border-radius:var(--radius-pill);color:#77583e;background:rgba(255,255,255,.55);font-size:9px;font-weight:500;backdrop-filter:blur(8px)}
.public-main{padding:0 18px 40px}
.public-about{padding:24px 4px 18px}
.public-about p{color:var(--muted);font-size:11px;line-height:1.7;margin-top:8px}
.public-info-card{display:flex;gap:14px;align-items:flex-start;padding:16px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-xs);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.public-info-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.public-info-icon{width:38px;height:38px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#f6ecdd,#ecdcc5);color:var(--gold-dark);font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.public-info-card strong{font-size:11.5px;color:var(--ink);font-weight:600}
.public-info-card p{color:var(--muted);font-size:10px;line-height:1.5;margin-top:5px}
.public-link{display:inline-block;padding:0;margin-top:9px;border:0;background:none;color:var(--gold-deep);font-size:10px;font-weight:700;letter-spacing:.2px}
.public-link:hover{color:var(--gold-dark)}
.public-services{margin-top:24px}
.public-section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}
.public-section-head h2{font-size:23px;margin-top:5px;letter-spacing:-.02em}
.public-section-head>a{color:var(--gold-deep);font-size:10px;font-weight:600}
.public-service-list{display:flex;flex-direction:column;gap:9px}
.public-service{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-xs);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.public-service:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.public-service strong,.public-service span{display:block}
.public-service strong{font-size:11.5px;font-weight:600;color:var(--ink)}
.public-service span{color:var(--muted);font-size:9.5px;margin-top:4px}
.public-service b{color:var(--gold-deep);font-size:11px;font-weight:700}
.public-cta{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding:18px 22px;border-radius:var(--radius);background:linear-gradient(135deg,#2f241d 0%,#4a382c 100%);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 14px 30px rgba(30,20,12,.22);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.public-cta:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(30,20,12,.26)}
.public-cta span{font-size:20px}
.public-footer{text-align:center;color:var(--muted-2);font-size:9px;margin-top:22px;letter-spacing:.3px}

/* ============ PORTFÓLIO ============ */
.public-portfolio-grid,.portfolio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.public-portfolio-card,.portfolio-card{display:block;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-xs);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.public-portfolio-card:hover,.portfolio-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.public-portfolio-image,.portfolio-card-image{height:120px;background:linear-gradient(145deg,#e8d3b6,#c39a6a);background-position:center;background-size:cover;display:grid;place-items:center;color:#fff;font:36px var(--font-serif)}
.public-portfolio-card strong,.public-portfolio-card small{display:block;padding:0 12px}
.public-portfolio-card strong{font-size:10.5px;margin-top:10px;font-weight:600;color:var(--ink)}
.public-portfolio-card small{color:var(--muted);font-size:9px;margin:4px 0 12px}
.portfolio-filter{margin:16px 0}
.portfolio-filter input{width:100%;height:46px;border:1px solid var(--border-strong);border-radius:13px;padding:0 14px;background:var(--surface);font-size:12px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.portfolio-filter input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow)}
.portfolio-card-body{padding:12px}
.portfolio-card-body strong,.portfolio-card-body small,.portfolio-card-body b{display:block}
.portfolio-card-body strong{font-size:11.5px;font-weight:600;color:var(--ink)}
.portfolio-card-body small{color:var(--muted);font-size:9px;margin-top:5px;line-height:1.4}
.portfolio-card-body b{color:var(--gold-deep);font-size:10.5px;margin:8px 0;font-weight:700}
.portfolio-card-body .btn{margin-top:8px;width:100%}

/* ============ MAINTENANCE CARD ============ */
.maintenance-card{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border:1px solid rgba(214,178,124,.5);border-radius:var(--radius);background:linear-gradient(135deg,#fff8ed,#f8ecda);box-shadow:0 6px 16px rgba(196,154,106,.14);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.maintenance-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(196,154,106,.2)}
.maintenance-card>.ico{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex-shrink:0;color:var(--gold-deep)}
.maintenance-card>.ico svg{width:22px;height:22px}
.maintenance-card div{flex:1}
.maintenance-card strong,.maintenance-card small{display:block}
.maintenance-card strong{font-size:11px;color:var(--ink);font-weight:600}
.maintenance-card small{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.maintenance-card>b{color:var(--gold-deep);font-weight:400;display:grid;place-items:center}

/* ============ RESPONSIVO ============ */
@media(min-width:700px){
  body{padding:30px 0;display:flex;align-items:center;justify-content:center}

/* ========== API SYNC ========== */
async function syncApiData(){if(!window.BeautyAPI?.isConnected())return;try{const [remoteServices,remotePros,remoteAppointments]=await Promise.all([window.BeautyAPI.services(),window.BeautyAPI.professionals(),window.BeautyAPI.appointments()]);services.splice(0,services.length,...remoteServices.map((s,i)=>{remoteServiceIds[s.name]=s.id;remoteServiceNames[s.id]=s.name;remoteServiceDetails[s.id]=s;return [s.name,s.description,moneyLabel(s.price_cents),['✦','✧','♡','✿','◇','○'][i%6],s.return_days||21]}));remoteProfessionalOptions=remotePros;professionals.splice(0,professionals.length,...remotePros.map(p=>[p.name,'Profissional','Atendimento personalizado',initials(p.name),'4.9']));appointments.splice(0,appointments.length,...remoteAppointments.map(a=>({id:a.id,client:a.client_name||'Cliente',service:remoteServiceNames[a.service_id]||a.service_name||'Serviço',date:String(a.date).split('-').reverse().join('/'),isoDate:a.date,time:a.time,pro:'Jozyhely Rodrigues',price:moneyLabel(a.value_cents),status:{confirmed:'Confirmado',pending:'Pendente',completed:'Concluído',cancelled:'Cancelado'}[a.status]||a.status,old:['completed','cancelled'].includes(a.status),rawStatus:a.status})));remoteNotifications=await window.BeautyAPI.notifications();whatsappPreferences=await window.BeautyAPI.whatsappPreferences();remoteDocuments=await window.BeautyAPI.documents();remoteLoyaltyClient=await window.BeautyAPI.loyaltyMe();remoteMaintenance=await window.BeautyAPI.maintenance();remotePortfolio=await window.BeautyAPI.portfolio();if(!remotePortfolio.length)remotePortfolio=DEMO_PORTFOLIO.map(x=>({...x}));if(state.apiUser?.role==='professional'){remoteInventory=await window.BeautyAPI.inventory();remotePurchases=await window.BeautyAPI.purchases();remoteLoyalty=await window.BeautyAPI.loyaltySettings();remoteClients=await window.BeautyAPI.clients();remoteBusiness=await window.BeautyAPI.businessProfile();remoteOperations=await window.BeautyAPI.operationalReport();remoteOutbox=await window.BeautyAPI.whatsappOutbox();remoteReturns=await window.BeautyAPI.returnReminders();remoteFinance=await window.BeautyAPI.financeTransactions();remoteReport=await window.BeautyAPI.reportSummary();remoteHours=await window.BeautyAPI.hours();remoteBlocks=await window.BeautyAPI.blocks()}}catch(error){console.warn('API indisponível; dados demonstrativos mantidos',error)}}
async function loadAvailability(){if(!window.BeautyAPI?.isConnected()||!state.client.service)return;const serviceId=remoteServiceIds[state.client.service];if(!serviceId)return;try{const result=await window.BeautyAPI.availability(state.client.date,serviceId);remoteSlots=result.slots.filter(x=>x.available).map(x=>x.time);if(remoteSlots.length&&!remoteSlots.includes(state.client.time))state.client.time=remoteSlots[0];render()}catch(error){console.warn('Disponibilidade remota indisponível',error)}}
function monthData(value){const [year,month]=value.split('-').map(Number);const first=new Date(year,month-1,1);const total=new Date(year,month,0).getDate();const offset=first.getDay();const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let day=1;day<=total;day++)cells.push({day,iso:`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`});while(cells.length%7)cells.push(null);return {year,month,cells,title:first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}}
function shiftMonth(delta){const [year,month]=calendarMonth.split('-').map(Number);const date=new Date(year,month-1+delta,1);calendarMonth=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;state.client.date=`${calendarMonth}-01`;state.client.time=null;remoteSlots=null}
async function confirmBooking(){if(!state.client.service||!state.client.professional||!state.client.time){alert('Escolha o serviço, a profissional e o horário antes de continuar.');return}if(state.demoMode){const selected=services.find(s=>s[0]===state.client.service);const item={id:`demo-${Date.now()}`,service:state.client.service,date:String(state.client.date).split('-').reverse().join('/'),isoDate:state.client.date,time:state.client.time,pro:state.client.professional,price:selected?.[2]||'R$ 0,00',status:'Pendente',rawStatus:'pending',old:false};appointments.unshift(item);demoData.appointments=appointments.map(x=>({...x}));saveDemo();state.route='confirmacao';location.hash=state.route;render();return}if(window.BeautyAPI?.isConnected()&&remoteServiceIds[state.client.service]){try{const appointment=await window.BeautyAPI.createAppointment({service_id:remoteServiceIds[state.client.service],date:state.client.date,time:state.client.time,payment_method:state.client.payment,portfolio_id:state.client.portfolioId||null,client_notes:document.querySelector('#booking-notes')?.value||'',custom_answers:{allergies:document.querySelector('#booking-allergies')?.value||''}});for(const extra of state.client.extras){if(remoteServiceIds[extra])await window.BeautyAPI.addAppointmentItem(appointment.id,{service_id:remoteServiceIds[extra],quantity:1})}await window.BeautyAPI.paySandbox(appointment.id);await syncApiData()}catch(error){alert(error.message);return}}state.route='confirmacao';location.hash=state.route;render()}

function renderPayment(){const selected=[state.client.service,...(state.client.extras||[])];const totalCents=selected.reduce((sum,name)=>{const s=services.find(x=>x[0]===name);return sum+(s?Math.round(Number(String(s[2]).replace(/[^0-9,]/g,'').replace(',','.'))*100):0)},0);return `<section class="screen" id="pagamento">${clientHeader('Agendamento · pagamento')}<main class="content"><div class="page-header"><a href="#horarios">${icon('chevronL',20)}</a><h2>Pagamento</h2><span></span></div><div class="payment-summary">${servicePhoto(state.client.service||'Nail Design','✦')}<div><strong>${esc(state.client.service||'Manicure e Pedicure')}</strong><span>${esc(state.client.professional||'Bruna Costa')} · ${String(state.client.date).split('-').reverse().join('/')} às ${state.client.time}</span><b>${moneyLabel(totalCents)}</b></div></div><div class="eyebrow" style="margin:20px 0 12px">Forma de pagamento</div><div class="payment-options"><label class="payment-option selected"><div class="payment-option-icon">⌁</div><div><strong>PIX</strong><span>Pagamento instantâneo</span></div><input type="radio" name="pay" value="pix" checked></label><label class="payment-option"><div class="payment-option-icon">▱</div><div><strong>Cartão</strong><span>Crédito ou débito</span></div><input type="radio" name="pay" value="card"></label><label class="payment-option"><div class="payment-option-icon">$</div><div><strong>Dinheiro</strong><span>Pagamento no atendimento</span></div><input type="radio" name="pay" value="cash"></label><label class="payment-option"><div class="payment-option-icon">＋</div><div><strong>Outro</strong><span>Combinar com o Studio</span></div><input type="radio" name="pay" value="other"></label></div><div class="admin-card" style="margin-bottom:18px"><h3 style="font-size:15px">Adicionar outro serviço</h3><p style="font-size:10.5px;color:var(--muted);margin:5px 0 10px">Opcional</p>${services.filter(s=>s[0]!==state.client.service).slice(0,3).map(s=>`<label style="display:flex;gap:9px;align-items:center;padding:8px 0;font-size:10.5px"><input type="checkbox" data-extra-service="${esc(s[0])}" ${state.client.extras.includes(s[0])?'checked':''}>${esc(s[0])} · ${s[2]}</label>`).join('')}</div><div class="admin-card" style="margin-bottom:18px"><h3>Informações do atendimento</h3><p style="font-size:10.5px;color:var(--muted);margin:5px 0 10px">Opcional — ajuda a profissional a se preparar.</p><div class="field"><label>Observações ou preferências</label><input id="booking-notes" placeholder="Ex.: preferência de cor"></div><div class="field"><label>Alergias ou sensibilidades</label><input id="booking-allergies" placeholder="Se houver, informe aqui"></div></div><button class="btn" data-confirm-booking>Confirmar agendamento</button></main></section>`}
function renderConfirmation(){const selected=[state.client.service,...(state.client.extras||[])].filter(Boolean);const total=selected.reduce((sum,name)=>{const s=services.find(x=>x[0]===name);return sum+(s?Number(String(s[2]).replace(/[^0-9,]/g,'').replace(',','.')):0)},0);const date=String(state.client.date||'').split('-').reverse().join('/');return `<section class="screen confirmation" id="confirmacao"><div class="success-icon">${icon('check',32)}</div><span class="eyebrow">TUDO CERTO</span><h1>Agendamento<br>confirmado!</h1><p>Seu horário foi reservado. Enviamos os detalhes para você acompanhar pelo app.</p><div class="confirmation-card">${servicePhoto(state.client.service||'Nail Design','✦')}<div><strong>${esc(state.client.service||'Manicure e Pedicure')}</strong><span>${date} · ${state.client.time} · ${esc(state.client.professional||'Jozyhely Rodrigues')}</span></div><b>${moneyLabel(Math.round(total*100))}</b></div><button class="btn" data-route="agendamentos">Ver meus agendamentos</button><a href="#cliente-home" style="font-size:11px;color:var(--gold-deep);margin-top:18px;font-weight:600">Voltar para o início</a></section>`}
function renderAppointments(){let list=state.tab==='upcoming'?appointments.filter(x=>!x.old):appointments.filter(x=>x.old);return `<section class="screen" id="agendamentos">${clientHeader('Seus horários')}<main class="content"><div class="page-header"><a href="#cliente-home">${icon('chevronL',20)}</a><h2>Agendamentos</h2><span></span></div><div class="tabs"><button class="${state.tab==='upcoming'?'active':''}" data-tab="upcoming">Próximos</button><button class="${state.tab==='history'?'active':''}" data-tab="history">Histórico</button></div><div class="appointment-list">${list.map(a=>`<article class="appointment-card">${servicePhoto(a.service,'✦')}<div class="appointment-info"><strong>${a.service}</strong><span>${a.date} · ${a.time}<br>${a.pro}</span><small>${a.price}</small></div><div><em class="status">${a.status}</em>${!a.old&&a.id?`<button class="btn small" style="margin-top:6px;background:#f3e9db;color:var(--gold-dark)" data-reschedule="${a.id}">Reagendar</button><button class="btn small" style="margin-top:6px;background:var(--red-bg);color:var(--red)" data-cancel="${a.id}">Cancelar</button>`:''}</div></article>`).join('')||'<div class="admin-card" style="padding:30px;text-align:center;color:var(--muted);font-size:12px">Nenhum agendamento nesta categoria.</div>'}</div></main>${bottom('appointments')}</section>`}
async function rescheduleAppointment(id){const date=prompt('Nova data (AAAA-MM-DD)','2026-09-18');const time=prompt('Novo horário (HH:MM)','14:00');if(!date||!time)return;try{if(state.demoMode){const item=appointments.find(x=>String(x.id)===String(id));if(item){item.date=date.split('-').reverse().join('/');item.isoDate=date;item.time=time;demoData.appointments=appointments.map(x=>({...x}));saveDemo()}render();return}if(window.BeautyAPI?.isConnected()){await window.BeautyAPI.rescheduleAppointment(id,date,time);await syncApiData()}const item=appointments.find(x=>String(x.id)===String(id));if(item){item.date=date.split('-').reverse().join('/');item.time=time}render()}catch(error){alert(error.message)}}
async function cancelAppointment(id){if(!confirm('Deseja cancelar este agendamento?'))return;if(state.demoMode){const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true;demoData.appointments=appointments.map(x=>({...x}));saveDemo()}render();return}if(window.BeautyAPI?.isConnected()){try{await window.BeautyAPI.updateAppointment(id,'cancelled');await syncApiData()}catch(error){alert(error.message);return}}const item=appointments.find(x=>String(x.id)===String(id));if(item){item.status='Cancelado';item.rawStatus='cancelled';item.old=true}render()}

lic-section-head"><div><span class="eyebrow">INSPIRAÇÕES</span><h2>Meu portfólio</h2></div><a href="#portfolio">Ver todos</a></div><div class="public-portfolio-grid">${remotePortfolio.slice(0,4).map(p=>`<a class="public-portfolio-card" href="#portfolio"><div class="public-portfolio-image" style="${p.photo_url?`background-image:url('${esc(p.photo_url)}')`:''}"><span>${p.photo_url?'':'✦'}</span></div><strong>${esc(p.title)}</strong><small>${esc(p.technique||p.category||'Nail Design')}</small></a>`).join('')}</div></section>`:''}<section class="public-services"><div class="public-section-head"><div><span class="eyebrow">ESCOLHA SEU CUIDADO</span><h2>Serviços</h2></div><a href="#servicos">Ver todos</a></div><div class="public-service-list">${visibleServices.map(s=>`<div class="public-service"><div><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span></div><b>${esc(s[2])}</b></div>`).join('')}</div></section><a class="public-cta" href="#servicos">Agendar meu horário <span>→</span></a><p class="public-footer">${esc(remoteBusiness.name||'Studio Jozyhely')} · Atendimento com carinho</p></div></main></section>`}

/* ========== RENDER: CONFIGURAÇÕES PRO (layout + inputs corrigidos) ========== */
function renderProSettings(){

    <div class="admin-card"><h3>Horários de atendimento</h3><p>Defina quando suas clientes podem agendar.</p>${hours.map(h=>`
      <div class="hours-row" data-hour-row="${h.weekday}">
        <strong>${days[h.weekday]}</strong>
        <div class="hours-times">
          <label><span>Início</span><input type="time" data-hour-open value="${h.open_time}" ${h.active?'':'disabled'}></label>

        </div>
        <button class="hours-save" data-hour-save="${h.weekday}" aria-label="Salvar ${days[h.weekday]}">${icon('check',16)}</button>
