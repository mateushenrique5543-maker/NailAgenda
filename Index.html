<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Jozyhely Rodrigues</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f0e9;--surface:#fffdfa;--ink:#231a14;--muted:#8d7d6f;--gold:#c39a6a;--gold-deep:#a67a45;--gold-light:#e6d4ba;--border:#ece1d4;--border-strong:#e0d0bd;--green:#4f8a5c;--green-bg:#e3f0e5;--red:#c15b5b;--red-bg:#fae0e0;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"DM Sans","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding-bottom:96px}
.screen.active{display:block}
h1,h2,h3{font-family:Georgia,"Playfair Display",serif;font-weight:600;line-height:1.15}
h1{font-size:28px}
h2{font-size:21px}
h3{font-size:16px}
.eyebrow{display:block;color:var(--gold-deep);font-size:10px;letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.content{padding:16px 18px 34px}
.top{padding:24px 20px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:15px;font-family:inherit;font-weight:600}
.top span{font-size:10px;color:var(--muted)}
.btn{width:100%;min-height:50px;border-radius:14px;background:linear-gradient(180deg,#2f241d,#1e1611);color:#fff;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;display:grid;place-items:center;padding:0 20px;margin-bottom:10px}
.btn.gold{background:linear-gradient(180deg,#f5e3c8,#d8b78e);color:#231a14}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--border-strong)}
.btn.small{width:auto;min-height:34px;padding:0 14px;font-size:10px;border-radius:10px;letter-spacing:.3px;text-transform:none;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;height:48px;padding:0 14px;border:1px solid var(--border-strong);border-radius:13px;background:var(--surface);font-size:13px;outline:0}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 24px;background:linear-gradient(165deg,#2e221a 0%,#1a120c 60%,#0f0a07 100%);color:#fff}
.login-box{width:100%;max-width:380px;text-align:center}
.brand-symbol{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(145deg,#d8b78e,#a67a45);color:#fff;font-family:Georgia,serif;font-size:34px;font-weight:600;display:grid;place-items:center}
.brand-name{font-family:Georgia,serif;font-size:26px;color:#f0dcc0}
.brand-sub{font-size:9px;letter-spacing:4px;color:#c5b0a0;margin-top:6px;text-transform:uppercase}
.login-box .field{text-align:left;margin-top:20px}
.login-box .field input{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.14)}
.login-box .field input::placeholder{color:#9c8a7c}
.muted-link{color:#c5b0a0;font-size:11px;display:block;text-align:center;margin-top:16px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,250,.96);border-top:1px solid var(--border);padding:8px 8px 10px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9px;font-weight:600;padding:6px 2px;border-radius:12px}
.nav button.active{color:var(--ink);background:linear-gradient(180deg,#fbf2e5,#f4e6d1)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px}
.item strong{font-size:13px;display:block}
.item small{color:var(--muted);font-size:11px;display:block;margin-top:3px}
.item b{color:var(--gold-deep);font-size:12px}
.day-block{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.range-row{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:end}
.range-row label{display:block}
.range-row label span{display:block;font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:4px}
.range-row input{width:100%;height:38px;padding:0 8px;border:1px solid var(--border-strong);border-radius:10px;font-size:12px}
.range-row button{width:34px;height:38px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:16px;font-weight:700}
.msg{padding:12px;border-radius:12px;margin-bottom:12px;font-size:13px}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}
.logout{color:var(--red);font-weight:600;font-size:12px;text-align:center;display:block;padding:14px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SUPABASE_URL='https://jibhejkxuxarhvuujgac.supabase.co';
const SUPABASE_KEY='sb_publishable_Ny9ydDIYrR17x5RkEYJGyw_GEZSEzAK';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={route:'inicio',user:null,role:null,services:[],hours:[],blocks:[],appointments:[],clients:[],msg:null,client:{service:null,date:null,time:null,serviceId:null}};
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(c){return 'R$ '+(Number(c||0)/100).toFixed(2).replace('.',',')}
function initials(n){return String(n||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'J'}
function showMsg(t,type){state.msg={t,type};render();setTimeout(()=>{state.msg=null},4000)}
function icon(name){
  const paths={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',spark:'<path d="M12 3v5M12 16v5M3 12h5M16 12h5"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>'};
  return `<svg viewBox="0 0 24 24">${paths[name]||''}</svg>`;
}
function nav(items,active){
  return `<nav class="nav">${items.map(([r,lb,ic])=>`<button data-go="${r}" class="${active===r?'active':''}">${icon(ic)}<span>${lb}</span></button>`).join('')}</nav>`;
}
async function syncAll(){
  try{
    const {data:services}=await sb.from('services').select('*').eq('is_active',true).order('name');
    state.services=(services||[]).map(s=>({id:s.id,name:s.name,description:s.description||'',price:s.price,duration:s.duration_minutes||60}));
    const {data:pros}=await sb.from('professionals').select('*');
    state.professionals=pros||[];
    const {data:hours}=await sb.from('schedules').select('*').order('weekday').order('open_time');
    state.hours=hours||[];
    const {data:blocks}=await sb.from('date_blocks').select('*').order('block_date');
    state.blocks=(blocks||[]).map(b=>({id:b.id,date:b.block_date,reason:b.reason}));
    if(state.role==='professional'){
      const {data:appts}=await sb.from('appointments').select('*').order('start_time',{ascending:false}).limit(100);
      state.appointments=(appts||[]).map(a=>({id:a.id,name:a.client_name,service_id:a.service_id,start:a.start_time,status:a.status,total:a.total}));
      const {data:cls}=await sb.from('clients').select('*');
      state.clients=cls||[];
    } else if(state.user){
      const {data:appts}=await sb.from('appointments').select('*').eq('client_id',state.user.id).order('start_time',{ascending:false});
      state.appointments=(appts||[]).map(a=>({id:a.id,name:a.client_name,service_id:a.service_id,start:a.start_time,status:a.status,total:a.total}));
    }
  }catch(e){console.warn(e)}
}
function svcName(id){const s=state.services.find(x=>x.id===id);return s?s.name:'Serviço'}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function fmtTime(iso){const d=new Date(iso);return d.toTimeString().slice(0,5)}

// ============ RENDER ============
function render(){
  const app=document.getElementById('app');
  const routes={inicio:viewInicio,login:viewLogin,register:viewRegister,'cli-home':viewCliHome,'cli-services':viewCliServices,'cli-schedule':viewCliSchedule,'cli-appts':viewCliAppts,'cli-profile':viewCliProfile,'pro-login':viewProLogin,'pro-dash':viewProDash,'pro-agenda':viewProAgenda,'pro-services':viewProServices,'pro-clients':viewProClients,'pro-settings':viewProSettings};
  const fn=routes[state.route]||viewInicio;
  app.innerHTML=(state.msg?`<div class="content" style="padding-bottom:0"><div class="msg ${state.msg.type}">${esc(state.msg.t)}</div></div>`:'')+fn();
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  document.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click',doLogout));
  bindView();
}
function go(r){state.route=r;location.hash=r;render()}

// ============ VIEWS ============

function viewCliHome(){
  const next=state.appointments[0];

    <div class="top"><div><strong>Olá! 👋</strong><span>Bem-vinda ao Studio</span></div></div>

  return `<section class="screen active">

    <main class="content">
      ${state.services.length?state.services.map(s=>`<div class="item" data-pick-service="${s.id}" data-price="${s.price}"><div><strong>${esc(s.name)}</strong><small>${s.duration} min</small></div><b>${money(s.price*100)}</b></div>`).join(''):'<div class="card" style="text-align:center;color:#8d7d6f">Nenhum serviço cadastrado ainda.</div>'}
    </main>
    ${nav([['cli-home','Início','home'],['cli-services','Agendar','spark'],['cli-appts','Horários','cal'],['cli-profile','Perfil','user']],'cli-services')}
  </section>`;
}
function viewCliSchedule(){
  const days=[];
  for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d)}
  return `<section class="screen active">
    <div class="top"><button data-go="cli-services">←</button><h2>Escolha a data</h2><span></span></div>
    <main class="content">
      <div class="card"><strong>Serviço: ${esc(state.client.service||'')}</strong></div>
      <div class="eyebrow">SELECIONE UM DIA</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">
        ${days.map(d=>{const iso=d.toISOString().slice(0,10);return `<button class="btn small" data-pick-date="${iso}" style="${iso===state.client.date?'background:#2f241d;color:#fff;border-color:#2f241d':''}">${d.getDate()}/${d.getMonth()+1}</button>`}).join('')}
      </div>
      <div class="eyebrow">HORÁRIOS</div>
      <div id="slots" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${state.client.slots?state.client.slots.map(t=>`<button class="btn small" data-pick-time="${t}" style="${t===state.client.time?'background:#2f241d;color:#fff':''}">${t}</button>`).join(''):'<p style="grid-column:1/-1;color:#8d7d6f;text-align:center;font-size:12px;padding:12px">Escolha um dia</p>'}</div>
      ${state.client.date&&state.client.time?`<button class="btn" id="btnConfirm" style="margin-top:24px">Confirmar agendamento</button>`:''}
    </main>
    ${nav([['cli-home','Início','home'],['cli-services','Agendar','spark'],['cli-appts','Horários','cal'],['cli-profile','Perfil','user']],'cli-services')}
  </section>`;
}

    <div class="top"><button data-go="cli-home">←</button><h2>Meu perfil</h2><span></span></div>

function viewProClients(){
  return `<section class="screen active">
    <div class="top"><h2>Clientes</h2><span></span></div>
    <main class="content">
      ${state.clients.length?state.clients.map(c=>`<div class="item"><div><strong>${esc(c.name)}</strong><small>${esc(c.email||'')} ${c.phone?'· '+esc(c.phone):''}</small></div></div>`).join(''):'<div class="card" style="text-align:center;color:#8d7d6f;padding:30px">Nenhuma cliente cadastrada ainda.</div>'}
    </main>
    ${nav([['pro-dash','Início','home'],['pro-agenda','Agenda','cal'],['pro-services','Serviços','spark'],['pro-settings','Ajustes','cog']],'pro-clients')}
  </section>`;
}
function viewProSettings(){
  const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const byDay={};for(let i=0;i<7;i++)byDay[i]=[];
  state.hours.forEach(h=>{if(!byDay[h.weekday])byDay[h.weekday]=[];byDay[h.weekday].push(h)});
  return `<section class="screen active">
    <div class="top"><h2>Ajustes</h2><span></span></div>
    <main class="content">
      <div class="card">
        <h3 style="margin-bottom:6px">Horários de atendimento</h3>
        <p style="color:#8d7d6f;font-size:11px;margin-bottom:14px">Marque os dias que você trabalha e defina as faixas.</p>
        ${days.map((name,wd)=>{
          const ranges=byDay[wd]; const open=ranges.length>0;
          return `<div class="day-block" data-day="${wd}" style="background:${open?'var(--surface)':'#f8f4ef'}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${open?'10px':'0'}">
              <label style="display:flex;gap:9px;align-items:center;font-weight:600;font-size:13px">
                <input type="checkbox" data-day-check="${wd}" ${open?'checked':''} style="width:18px;height:18px;accent-color:#a67a45">
                ${name}
              </label>
              ${open?`<button class="btn small" data-copy-day="${wd}" style="background:none;color:var(--gold-deep);text-decoration:underline">Copiar</button>`:''}
            </div>
            ${open?ranges.map(r=>`<div class="range-row">
              <label><span>INÍCIO</span><input type="time" data-range-open="${wd}" value="${r.open_time}"></label>
              <label><span>FIM</span><input type="time" data-range-close="${wd}" value="${r.close_time}"></label>
              <button data-remove-range="${wd}">×</button>
            </div>`).join(''):''}
            ${open?`<button class="btn small" data-add-range="${wd}" style="width:100%;border:1px dashed var(--border-strong);padding:8px;color:var(--gold-deep);background:none;margin-top:6px">+ Adicionar faixa</button>`:''}
            ${open?`<button class="btn small" data-save-day="${wd}" style="width:100%;background:#2f241d;color:#fff;padding:9px;margin-top:6px">Salvar ${name}</button>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px">Bloquear data (férias, feriado)</h3>
        <div class="field"><label>Data</label><input id="blkDate" type="date"></div>
        <div class="field"><label>Motivo</label><input id="blkReason" placeholder="Ex: Natal"></div>
        <button class="btn small" id="btnAddBlock" style="background:#2f241d;color:#fff;padding:10px;width:100%">Bloquear data</button>
        <div style="margin-top:14px">
          ${state.blocks.length?state.blocks.map(b=>`<div class="item"><div><strong>${b.date.split('-').reverse().join('/')}</strong><small>${esc(b.reason||'Bloqueado')}</small></div><button class="btn small" data-del-block="${b.id}" style="background:#fae0e0;color:#c15b5b">Remover</button></div>`).join(''):'<p style="color:#8d7d6f;font-size:12px">Nenhuma data bloqueada.</p>'}
        </div>
      </div>
      <button class="logout" data-logout>Sair da área profissional</button>
    </main>
    ${nav([['pro-dash','Início','home'],['pro-agenda','Agenda','cal'],['pro-services','Serviços','spark'],['pro-settings','Ajustes','cog']],'pro-settings')}
  </section>`;
}

// ============ BIND ============
function bindView(){
  document.querySelector('#btnLogin')?.addEventListener('click',doLoginClient);
  document.querySelector('#btnRegister')?.addEventListener('click',doRegister);
  document.querySelector('#btnProLogin')?.addEventListener('click',doLoginPro);
  document.querySelectorAll('[data-pick-service]').forEach(el=>el.addEventListener('click',()=>{
    state.client.service=el.querySelector('strong').textContent;
    state.client.serviceId=el.dataset.pickService;
    state.client.date=null;state.client.time=null;state.client.slots=null;
    go('cli-schedule');
  }));
  document.querySelectorAll('[data-pick-date]').forEach(el=>el.addEventListener('click',async()=>{
    state.client.date=el.dataset.pickDate;state.client.time=null;
    const svc=state.services.find(s=>s.id===state.client.serviceId);
    const dur=svc?svc.duration:60;
    const wd=new Date(state.client.date+'T12:00:00').getDay();
    const blk=state.blocks.find(b=>b.date===state.client.date);
    if(blk){state.client.slots=[];showMsg('Data bloqueada: '+(blk.reason||''),'err');render();return}
    const ranges=state.hours.filter(h=>h.weekday===wd);
    if(!ranges.length){state.client.slots=[];showMsg('Não trabalha neste dia','err');render();return}
    const {data:busy}=await sb.from('appointments').select('start_time,end_time').gte('start_time',state.client.date+'T00:00:00').lte('start_time',state.client.date+'T23:59:59').in('status',['pending','confirmed']);
    const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
    const slots=[];
    ranges.forEach(r=>{
      const end=toMin(r.close_time);
      for(let m=toMin(r.open_time);m+dur<=end;m+=30){
        const start=new Date(state.client.date+'T00:00:00');start.setMinutes(m);
        const fim=new Date(start.getTime()+dur*60000);
        const conflict=(busy||[]).some(b=>{const bs=new Date(b.start_time),be=new Date(b.end_time);return start<be&&fim>bs});
        if(!conflict)slots.push(start.toTimeString().slice(0,5));
      }
    });
    state.client.slots=slots;render();
  }));
  document.querySelectorAll('[data-pick-time]').forEach(el=>el.addEventListener('click',()=>{state.client.time=el.dataset.pickTime;render()}));
  document.querySelector('#btnConfirm')?.addEventListener('click',doConfirmBooking);
  document.querySelector('#btnAddService')?.addEventListener('click',doAddService);
  document.querySelector('#btnAddBlock')?.addEventListener('click',doAddBlock);
  document.querySelectorAll('[data-del-block]').forEach(el=>el.addEventListener('click',doDelBlock));
  document.querySelectorAll('[data-day-check]').forEach(el=>el.addEventListener('change',async()=>{
    const wd=Number(el.dataset.dayCheck);const blk=el.closest('[data-day]');
    if(el.checked){
      const opens=[...blk.querySelectorAll('[data-range-open]')];
      const closes=[...blk.querySelectorAll('[data-range-close]')];
      const ranges=opens.length?opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value})):[{open_time:'09:00',close_time:'18:00'}];
      await saveDay(wd,ranges);
    } else {
      if(!confirm('Fechar este dia?')){el.checked=true;return}
      await saveDay(wd,[]);
    }
  }));
  document.querySelectorAll('[data-add-range]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.addRange);const blk=el.closest('[data-day]');
    const opens=[...blk.querySelectorAll('[data-range-open]')];const closes=[...blk.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value}));
    ranges.push({open_time:'14:00',close_time:'18:00'});
    await saveDay(wd,ranges);
  }));
  document.querySelectorAll('[data-remove-range]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.removeRange);const blk=el.closest('[data-day]');
    const opens=[...blk.querySelectorAll('[data-range-open]')];const closes=[...blk.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value}));
    ranges.splice(0,1);
    await saveDay(wd,ranges);
  }));
  document.querySelectorAll('[data-save-day]').forEach(el=>el.addEventListener('click',async()=>{
    const wd=Number(el.dataset.saveDay);const blk=el.closest('[data-day]');
    const opens=[...blk.querySelectorAll('[data-range-open]')];const closes=[...blk.querySelectorAll('[data-range-close]')];
    const ranges=opens.map((i,idx)=>({open_time:i.value,close_time:closes[idx].value}));
    await saveDay(wd,ranges);showMsg('Horários salvos!','ok');
  }));
  document.querySelectorAll('[data-copy-day]').forEach(el=>el.addEventListener('click',async()=>{
    const from=Number(el.dataset.copyDay);
    const inp=prompt('Copiar para quais dias? (0=Dom 1=Seg 2=Ter 3=Qua 4=Qui 5=Sex 6=Sáb) Ex: 1,2,3','');
    if(!inp)return;
    const to=inp.split(',').map(x=>Number(x.trim())).filter(n=>n>=0&&n<=6&&n!==from);
    if(!to.length)return;
    const src=state.hours.filter(h=>h.weekday===from).map(h=>({open_time:h.open_time,close_time:h.close_time}));
    for(const wd of to){await sb.from('schedules').delete().eq('weekday',wd);if(src.length){await sb.from('schedules').insert(src.map(r=>({weekday:wd,active:true,open_time:r.open_time,close_time:r.close_time})))}};
    await syncAll();showMsg('Copiado!','ok');
  }));
}
async function saveDay(wd,ranges){
  try{
    await sb.from('schedules').delete().eq('weekday',wd);
    if(ranges.length)await sb.from('schedules').insert(ranges.map(r=>({weekday:wd,active:true,open_time:r.open_time,close_time:r.close_time})));
    await syncAll();render();
  }catch(e){showMsg(e.message,'err')}
}

// ============ AÇÕES ============
async function doLoginClient(){
  const email=document.querySelector('#email').value.trim();
  const password=document.querySelector('#password').value;
  if(!email||!password){showMsg('Preencha e-mail e senha','err');return}
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){showMsg(error.message,'err');return}
  state.user=data.user;state.role='client';
  await syncAll();showMsg('Bem-vinda!','ok');go('cli-home');
}
async function doLoginPro(){
  const email=document.querySelector('#proEmail').value.trim();
  const password=document.querySelector('#proPass').value;
  if(!email||!password){showMsg('Preencha os dados','err');return}
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){showMsg(error.message,'err');return}
  state.user=data.user;state.role='professional';
  await syncAll();showMsg('Bem-vinda, Jozhy!','ok');go('pro-dash');
}
async function doRegister(){
  const name=document.querySelector('#rName').value.trim();
  const email=document.querySelector('#rEmail').value.trim();
  const phone=document.querySelector('#rPhone').value.trim();
  const password=document.querySelector('#rPass').value;
  if(!name||!email||password.length<6){showMsg('Preencha tudo (senha 6+)','err');return}
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,phone}}});
  if(error){showMsg(error.message,'err');return}
  await sb.from('clients').insert({user_id:data.user.id,name,email,phone});
  showMsg('Conta criada! Agora entre.','ok');go('login');
}
async function doLogout(){
  await sb.auth.signOut();
  state.user=null;state.role=null;state.appointments=[];
  go('inicio');
}
async function doConfirmBooking(){
  if(!state.client.serviceId||!state.client.date||!state.client.time){showMsg('Escolha serviço, data e horário','err');return}
  const svc=state.services.find(s=>s.id===state.client.serviceId);
  const start=new Date(state.client.date+'T'+state.client.time+':00');
  const end=new Date(start.getTime()+svc.duration*60000);
  const {data:c}=await sb.from('clients').select('name').eq('user_id',state.user.id).maybeSingle();
  const {error}=await sb.from('appointments').insert({
    client_id:state.user.id,
    client_name:c?.name||state.user.email,
    service_id:state.client.serviceId,
    start_time:start.toISOString(),
    end_time:end.toISOString(),
    status:'pending',
    total:svc.price
  });
  if(error){showMsg(error.message,'err');return}
  showMsg('Agendamento confirmado! 💅','ok');
  await syncAll();go('cli-home');
}
async function doAddService(){
  const name=prompt('Nome do serviço');if(!name)return;
  const price=prompt('Preço (ex: 50)','50');if(!price)return;
  const dur=prompt('Duração em minutos','60');
  const {error}=await sb.from('services').insert({name,description:'Serviço do Studio',price:Number(price.replace(',','.')),duration_minutes:Number(dur)||60,is_active:true});
  if(error){showMsg(error.message,'err');return}
  await syncAll();showMsg('Serviço adicionado!','ok');
}
async function doAddBlock(){
  const date=document.querySelector('#blkDate').value;
  const reason=document.querySelector('#blkReason').value.trim();
  if(!date){showMsg('Escolha uma data','err');return}
  const {error}=await sb.from('date_blocks').insert({block_date:date,reason:reason||null});
  if(error){showMsg(error.message,'err');return}
  await syncAll();showMsg('Data bloqueada!','ok');
}
async function doDelBlock(el){
  const id=el.target.dataset.delBlock;
  await sb.from('date_blocks').delete().eq('id',id);
  await syncAll();showMsg('Removido!','ok');
}

// ============ INIT ============
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){
    state.user=data.session.user;
    const email=data.session.user.email.toLowerCase();
    state.role=(email.includes('jozy')||email.includes('admin'))?'professional':'client';
    await syncAll();
    go(state.role==='professional'?'pro-dash':'cli-home');
  } else {
    state.route=location.hash.slice(1)||'inicio';
    render();
  }
})();
window.addEventListener('hashchange',()=>{if(!state.user){state.route=location.hash.slice(1)||'inicio';render()}});
</script>
